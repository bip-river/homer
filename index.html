 rels:[{id:"tiresias",label:"the prophet found here"},{id:"odysseus",label:"the living visitor"},{id:"achilles",label:"whose ghost he meets"},{id:"elpenor",label:"the first ghost met here"}]
},
{
 id:"cyclops_land", name:"Land of the Cyclopes", resp:"SY-klops", type:"place", epic:"odyssey",
 essence:"The lawless island of the Cyclopes — no laws, no ships, no hospitality — where Odysseus's cleverness first saves and dooms him in a single stroke.",
 sections:[
  {h:"A land without laws", body:"The Land of the Cyclopes is home to the one-eyed giants, of whom [[polyphemus|Polyphemus]] is one — a rich island that grows crops without farming, where the giants live scattered in caves, each lording it over his own family with no laws, no assemblies, no agriculture, and no regard for the gods or for guests. To the Greeks it is the very picture of savagery: a place with everything except civilization."},
  {h:"The trap", body:"It's here that [[odysseus|Odysseus]]'s curiosity gets the better of him. He explores [[polyphemus|Polyphemus]]'s cave, is trapped, and watches his men eaten — escaping only by a brilliant trick with a sharpened stake and a false name. But his one lapse, boasting his real name as he sails away, hands the Cyclops the curse that dooms the entire voyage. The island is where cunning both saves him and destroys him."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The Cyclopes are the Odyssey's benchmark for barbarism — the anti-Phaeacians, defined entirely by what they lack: law, farming, ships, and above all the sacred hospitality [[zeus|Zeus]] protects. The word \"cyclops\" (round-eye) later got attached to the massive prehistoric walls of [[mycenae|Mycenae]], which awestruck Greeks assumed only such giants could have built — \"Cyclopean masonry\" to this day. And Polyphemus's cave gave storytelling one of its most durable monsters, echoed from Sinbad to countless films since.</p>",
 rels:[{id:"polyphemus",label:"its most famous giant"},{id:"odysseus",label:"who is trapped here"},{id:"poseidon",label:"whose son rules here"}]
},
{
 id:"pylos", name:"Pylos", resp:"PY-loss", type:"place", epic:"odyssey",
 essence:"Old Nestor's sandy kingdom — the wise, orderly court where Telemachus begins the search for his father.",
 sections:[
  {h:"Nestor's realm", body:"Pylos is the seaside kingdom of the aged, garrulous [[nestor|Nestor]], on the western coast of the Greek Peloponnese — \"sandy Pylos,\" Homer calls it. When [[telemachus|Telemachus]] sets out to find news of his father, Pylos is his first stop, and Nestor's well-run, pious court his first lesson in what a proper kingdom looks like."},
  {h:"A model of order", body:"The visit shows [[telemachus|Telemachus]] — and us — what [[ithaca|Ithaca]] should be and isn't: a peaceful realm hosting strangers generously, honoring the gods, ruled by a settled king surrounded by his grown sons. It is the ordered world the boy is trying to restore back home, glimpsed here in the flesh."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Pylos delivered one of Homeric archaeology's great triumphs: a genuine Bronze Age palace was excavated on a hilltop there and dubbed the \"Palace of Nestor,\" complete with a throne room, a bathtub, and — astonishingly — an archive of clay tablets in the \"Linear B\" script, which turned out to be an early form of Greek. Nestor's sandy kingdom proved to be one of the most tangible links between Homer's legendary world and a real, documented one.</p>",
 rels:[{id:"nestor",label:"its king"},{id:"telemachus",label:"its young visitor"},{id:"odysseus",label:"the man he seeks news of"}]
},
{
 id:"thrinacia", name:"Thrinacia", resp:"thrih-NAY-shuh", type:"place", epic:"odyssey",
 essence:"The island of the Sun's sacred cattle — the fatal temptation that finishes off the last of Odysseus's crew.",
 sections:[
  {h:"The forbidden island", body:"Thrinacia is the sun-drenched island where [[helios|the Sun-god]] pastures his herds of magnificent, immortal cattle. Both [[tiresias|Tiresias]] and [[circe|Circe]] warn [[odysseus|Odysseus]] in the gravest terms: land there if you must, but on no account touch the cattle, or your ship and crew are doomed."},
  {h:"The last mistake", body:"Pinned down by foul winds and slowly starving, the crew — egged on by [[eurylochus|Eurylochus]] — wait until Odysseus sleeps and slaughter the [[helios_cattle|sacred cattle]] anyway. [[helios|Helios]] demands justice, [[zeus|Zeus]] smashes the ship with a thunderbolt, and every man drowns but Odysseus. Thrinacia is where his last companions destroy themselves — not through any monster, but through hunger and one fatal act of disobedience."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Thrinacia was often identified in antiquity with Sicily, its three-cornered shape echoing the island's old name, Trinacria. The episode is the Odyssey at its most starkly moral: the men are explicitly, repeatedly warned; they choose to transgress; and they pay in full. It is the poem's clearest statement that some disasters aren't luck or divine spite, but simply the harvest of a choice — a rare thing in a world where the gods so often take the blame.</p>",
 rels:[{id:"helios_cattle",label:"the forbidden herd here"},{id:"odysseus",label:"whose crew is doomed here"},{id:"tiresias",label:"who warned of this place"},{id:"helios",label:"whose cattle graze here"}]
},
{
 id:"lotus_land", name:"Land of the Lotus-Eaters", resp:"", type:"place", epic:"odyssey",
 essence:"The land of the Lotus-Eaters — where a single taste of sweet forgetfulness makes men lose all desire to ever go home.",
 sections:[
  {h:"The sweet forgetting", body:"The Land of the Lotus-Eaters is an early, deceptively gentle stop on [[odysseus|Odysseus]]'s voyage. Its people mean no harm; they simply offer his scouts the honey-sweet lotus fruit — and any man who eats it instantly forgets his home, his journey, and every wish except to stay and eat lotus forever."},
  {h:"The first temptation", body:"[[odysseus|Odysseus]] has to drag his weeping, blissed-out men back to the ships by force and lash them to the benches. It is the mildest-seeming danger of the whole voyage, and one of the most insidious: no violence, no monster, just the sweet, total erasure of the will to go home. The lotus is everything the Odyssey fears — the surrender that feels wonderful."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The Lotus-Eaters gave the language \"lotus-eater\" for anyone lost in dreamy, idle contentment, and Tennyson built a famous, hypnotic poem out of the temptation to stop striving. What exactly the plant was — a real North African fruit? something stronger? — has been guessed at since antiquity, but its meaning is plain enough: it is the oldest image in Western literature of the drug, or the comfort, that quietly dissolves the will to keep going.</p>",
 rels:[{id:"odysseus",label:"whose men are tempted"}]
},

/* ===================== THINGS ===================== */
{
 id:"trojan_horse", name:"The Trojan Horse", resp:"", type:"thing", epic:"both",
 essence:"The hollow wooden horse packed with soldiers \u2014 history's most famous gift, and the enduring reason nobody should ever fully trust one.",
 sections:[
  {h:"What it is", body:"After ten years of battering uselessly against Troy's walls, the Greeks win with a trick generally credited to [[odysseus|Odysseus]]. They build an enormous hollow wooden horse, hide their best fighters inside it, burn their camp, and sail away over the horizon as though finally giving up \u2014 leaving the horse behind as an apparent parting gift to the gods. The Trojans, giddy with relief that the nightmare is over, haul the thing through their own gates with their own hands. That night the hidden Greeks climb down, open the gates, and signal the fleet, which had only slipped out of sight. Troy falls in a single night \u2014 conquered not by force, in the end, but by its own desperate wish for the war to be finished."},
  {h:"The warnings ignored", body:"It very nearly fails. A Trojan priest named Laoco\u00f6n warns that it's a trap and flings a spear into the horse's wooden flank \u2014 and is immediately strangled, along with his two sons, by serpents that rise out of the sea, which the watching Trojans take as a sign that the priest was wrong and the horse is holy. (Interpreting omens, it turns out, is a high-risk occupation.) [[cassandra|Cassandra]], cursed to see the future and be believed by no one, shrieks that the city is doomed. They wheel the horse in anyway. The trick works, ultimately, because people are extraordinarily good at believing whatever they most desperately want to be true."},
  {h:"A note on the horse itself", body:"Strikingly, Homer never actually stages the scene \u2014 in the Odyssey it's recalled in passing, sung by a court bard while [[odysseus|Odysseus]] sits quietly weeping at hearing his own cleverness turned into a song. The famous full version comes centuries later, from the Roman poet Virgil, who also handed down the line every schoolchild half-remembers in some form: <em>\"I fear the Greeks, even those bearing gifts.\"</em>"}
 ],
 lore:"<p><span class=\"loretag\">World</span>The horse long ago escaped its own story and became a permanent part of the language. A \"Trojan horse\" is now any hostile thing smuggled in disguised as a benefit \u2014 which is exactly why the malicious software that hides inside a program you actually wanted is called a \"trojan.\" Historians have argued for centuries about what, if anything, the wooden horse really was: guesses range from a siege engine (a battering ram sheltered under a horse-hide roof) to a ship (Greek vessels sometimes had horse-head prows) to nothing at all beyond a memorable image. It may be pure poetry. But as a <em>symbol</em> \u2014 the gift that is really an ambush, the victory a people carry through their own gates because they cannot bear to keep fearing \u2014 it has never once been improved upon in three thousand years of trying.</p>",
 rels:[{id:"odysseus",label:"its mastermind"},{id:"troy",label:"the city it destroys"},{id:"cassandra",label:"who warned against it"}]
},
{
 id:"achilles_armor", name:"Achilles's Armor", resp:"", type:"thing", epic:"iliad",
 aka:"the Shield of Achilles",
 essence:"The divine armor forged by a god for the greatest warrior — and above all the great shield, on which the whole human world is engraved in miniature.",
 sections:[
  {h:"The god-forged arms", body:"When [[patroclus|Patroclus]] is killed wearing [[achilles|Achilles]]'s original armor, [[thetis|Thetis]] begs the smith-god [[hephaestus|Hephaestus]] to forge her son a magnificent new set. He works through the night and produces armor no mortal smith could match — but it is the great shield that stops the poem in its tracks."},
  {h:"The world on a shield", body:"Homer spends a long, famous passage describing the scenes [[hephaestus|Hephaestus]] hammers into the shield: two cities, one at peace with weddings and lawsuits, one besieged and at war; fields plowed and harvested; a wedding dance; herds and vineyards; the earth, sea, sun, and stars ringing it all. In the middle of a war poem, the god engraves the entire world the war is set against — everything ordinary and alive that the fighting interrupts."}
 ],
 mind:"<p>The Shield of Achilles is Homer's great act of <strong>stepping back</strong>. For one long passage the killing stops and the poem shows us the whole of human life — law, love, labor, festival, peace — the world the Iliad's violence keeps shattering. It is the poem quietly telling us what all the glory costs, and what it costs it against.</p><p><span class=\"mindtag\">Beauty made for death</span>There's a deep irony in it: the most beautiful object in the poem is armor, made to protect a man everyone knows is about to die. Even this god-made perfection cannot save Achilles — it can only make his death magnificent.</p>",
 lore:"<p><span class=\"loretag\">World</span>The shield's description is the founding example of \"ekphrasis\" — a vivid verbal description of a work of art — and one of the most influential passages in Western poetry. Poets have answered it for millennia; W. H. Auden's modern \"The Shield of Achilles\" reimagines it filled not with festivals but with the barbed wire and bureaucratic murder of the twentieth century, a bleak reply to Homer's dancing and harvests across three thousand years.</p>",
 rels:[{id:"achilles",label:"its wearer"},{id:"hephaestus",label:"its maker"},{id:"thetis",label:"who commissions it"},{id:"patroclus",label:"who dies in the old set"}]
},
{
 id:"odysseus_bow", name:"Odysseus's Bow", resp:"", type:"thing", epic:"odyssey",
 essence:"The great bow only Odysseus can string — the test that unmasks the beggar as the king, and the weapon that begins the suitors' slaughter.",
 sections:[
  {h:"The bow no one can bend", body:"Odysseus's war-bow is a magnificent weapon he left behind in [[ithaca|Ithaca]] when he sailed for [[troy|Troy]] — so stiff and powerful that no ordinary man can even string it. Out of options, [[penelope|Penelope]] finally sets it as the ultimate test: she will marry whichever suitor can string the great bow and shoot an arrow through a row of axe-heads, as her husband once did."},
  {h:"The unmasking", body:"One by one the [[antinous|suitors]] strain and fail; not one can so much as bend it. Then the ragged \"beggar\" asks for a turn and, to their scorn, strings the bow effortlessly and sends the arrow clean through the axes. In that instant the disguise falls away — the beggar is the king — and his very next shot kills [[antinous|Antinous]]. The bow is the hinge between hiding and vengeance."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The contest of the bow is one of literature's great recognition-through-action scenes: identity proven not by a birthmark or a password but by a feat only the true man can perform. It gave the world an enduring image — the hidden king revealed by a test of strength — echoed in countless later stories: the sword only the rightful heir can draw, the trial no impostor can pass. Odysseus's bow is arguably their common ancestor.</p>",
 rels:[{id:"odysseus",label:"the only man who can string it"},{id:"penelope",label:"who sets the contest"},{id:"antinous",label:"a suitor who fails it"}]
},
{
 id:"golden_apple", name:"The Golden Apple", resp:"", type:"thing", epic:"iliad",
 aka:"the Judgment of Paris",
 essence:"The apple “for the fairest” — one small golden fruit, tossed among three goddesses, that set the entire Trojan War in motion.",
 sections:[
  {h:"The apple of discord", body:"At the wedding of [[thetis|Thetis]], the uninvited goddess of Discord rolls a single golden apple into the party, inscribed with two words: \"for the fairest.\" [[hera|Hera]], [[athena|Athena]], and [[aphrodite|Aphrodite]] each claim it, and the quarrel grows so dangerous that [[zeus|Zeus]] wisely refuses to judge it himself."},
  {h:"The fatal choice", body:"The decision is dumped on a Trojan prince, [[paris|Paris]]. Each goddess offers a bribe — [[hera|Hera]] power, [[athena|Athena]] wisdom and victory, [[aphrodite|Aphrodite]] the most beautiful woman in the world. Paris picks beauty, awards Aphrodite the apple, and wins himself [[helen|Helen]] — who is already married. From that one shallow choice flows the abduction, the war, and the fall of [[troy|Troy]]. The whole Iliad hangs on a piece of fruit."}
 ],
 mind:"<p>The Golden Apple is the Iliad's reminder that <strong>vast catastrophes can grow from tiny, vain beginnings</strong>. A wedding slight, a beauty contest, a young man's appetite — and ten years later a city burns. Homer's world runs on such disproportion: the smallest human weakness, magnified through pride and the meddling of gods, into total war.</p>",
 lore:"<p><span class=\"loretag\">World</span>The \"apple of discord\" became a permanent phrase for any small thing that sparks a large quarrel, and the \"Judgment of Paris\" one of the most-painted scenes in all of Western art. The tale even seems to have helped fix the later European tradition that the forbidden fruit of Eden was an apple — leaving that particular fruit forever entangled, in the Western imagination, with beauty, temptation, and trouble.</p>",
 rels:[{id:"paris",label:"its judge"},{id:"aphrodite",label:"who won it"},{id:"hera",label:"who lost it"},{id:"athena",label:"who lost it"},{id:"helen",label:"the prize behind it"}]
},
{
 id:"aegis", name:"The Aegis", resp:"EE-jiss", type:"thing", epic:"iliad",
 essence:"The terrifying goatskin shield of Zeus and Athena — a divine weapon of pure fear, fringed with a Gorgon's head, that routs whole armies at a shake.",
 sections:[
  {h:"The shield of dread", body:"The Aegis is the awesome protective device wielded by [[zeus|Zeus]] and lent to [[athena|Athena]] — usually pictured as a fringed goatskin or breastplate, tasseled with gold and bearing the severed head of the Gorgon, whose face freezes the blood. It is less armor than a weapon of terror."},
  {h:"Panic on the field", body:"When a god shakes the Aegis over the battlefield, whole armies lose their nerve and break. It embodies the sudden, causeless battlefield panic the Greeks knew was real — the way courage can drain from a line of men in an instant, as if a god had simply willed it. The Aegis is fear itself, made into an object."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The word survives everywhere: to act \"under the aegis\" of a person or institution is to work under their protection and authority — a direct descendant of Zeus's shield. From a symbol of a god's terrifying protection it has mellowed, over three thousand years, into the language of grant committees and corporate sponsorship, which is a considerable comedown for an object fringed with a monster's severed head.</p>",
 rels:[{id:"athena",label:"who wields it in battle"},{id:"zeus",label:"its true owner"}]
},
{
 id:"moly", name:"Moly", resp:"MOH-lee", type:"thing", epic:"odyssey",
 essence:"The magic herb that saves Odysseus from Circe's spell — literature's first named counter-potion, handed over by a god.",
 sections:[
  {h:"The god's gift", body:"Moly is a mysterious plant with a black root and a milk-white flower, given to [[odysseus|Odysseus]] by the god [[hermes|Hermes]] as he heads to confront the witch [[circe|Circe]]. Hermes warns that it's dangerous for mortals to dig up but harmless to the gods — and that it alone can protect Odysseus from Circe's transforming magic."},
  {h:"The one who couldn't be turned", body:"Fortified by moly, [[odysseus|Odysseus]] eats and drinks at [[circe|Circe]]'s table unharmed; when she taps him with her wand to make him a pig, nothing happens. Her power broken, the astonished goddess turns from enemy to ally. The little herb is what lets cleverness survive where brute force would have failed."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Moly is one of literature's first magical plants, and generations of botanists have hunted for the real herb behind it — snowdrop, which contains a compound that genuinely counters certain poisons, is a favorite modern guess, tantalizingly matching Homer's black root and white flower. Whether or not Homer had a specific plant in mind, moly became the ancestor of every magic herb, antidote, and protective charm in the fantasy tradition that followed.</p>",
 rels:[{id:"hermes",label:"who gives it"},{id:"circe",label:"whose magic it foils"},{id:"odysseus",label:"whom it protects"}]
},
{
 id:"wind_bag", name:"The Bag of Winds", resp:"", type:"thing", epic:"odyssey",
 essence:"The sack that held every storm — a gift meant to send Odysseus straight home, ruined by his own crew's greed within sight of Ithaca.",
 sections:[
  {h:"The gift of the winds", body:"[[aeolus|Aeolus]], keeper of the winds, gives [[odysseus|Odysseus]] an extraordinary parting gift: a leather bag with all the stormy winds tied up tight inside, leaving out only the gentle west wind to blow his ships straight home. For nine days it works perfectly, and [[ithaca|Ithaca]] itself comes into sight."},
  {h:"So close", body:"As Odysseus sleeps, exhausted, his crew eye the bag and convince themselves it's full of gold their captain is hiding from them. They open it — and every storm bursts out at once, blasting the ships all the way back to Aeolus's island. Home was literally on the horizon. The bag of winds is the Odyssey's most agonizing near-miss, and a small parable about a crew's fatal inability to trust."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The bag of winds is one of the oldest and most durable images in storytelling: the container of trapped forces that must not be opened, close kin to Pandora's box (really a jar). It endures because it's such a perfect little machine of frustration: the disaster is entirely self-inflicted, born of suspicion and greed, and it strikes at the exact moment of near-success. Every \"we were so close, and then somebody had to meddle\" story owes it a debt.</p>",
 rels:[{id:"odysseus",label:"who is given it"},{id:"ithaca",label:"the home it nearly reached"},{id:"aeolus",label:"who gives it"}]
},
{
 id:"siren_song", name:"The Sirens", resp:"SY-renz", type:"thing", epic:"odyssey",
 essence:"The song so beautiful it lures sailors to their deaths — and the temptation Odysseus alone survives, by having himself bound to the mast to hear it.",
 sections:[
  {h:"The deadly music", body:"The Sirens are creatures whose singing is so irresistibly beautiful that any sailor who hears it steers helplessly toward them and dies, the shore around them white with the bones of the men they've lured. [[circe|Circe]] warns [[odysseus|Odysseus]] of them, and tells him the only way past."},
  {h:"Bound to the mast", body:"Desperate to hear the song and live — the one man ever to manage it — [[odysseus|Odysseus]] plugs his crew's ears with wax and has them lash him to the mast, with strict orders to bind him tighter, not release him, however much he begs. He hears the Sirens, is driven half-mad with longing, strains at the ropes — and survives. It is a perfect image of desire indulged and contained at once."}
 ],
 mind:"<p>The Sirens are the Odyssey's subtlest temptation: not comfort or appetite but <strong>the seduction of knowing</strong>. What they actually promise, in their song, is knowledge — they claim to know everything that happened at [[troy|Troy]] and all that will ever happen on earth. Odysseus's insatiable curiosity, his defining trait, is exactly the weakness they target.</p><p><span class=\"mindtag\">Wanting the forbidden safely</span>His solution — hear it, but bound — is a strikingly modern piece of self-knowledge: he doesn't trust his own future will, so he ties up his present self in advance. Economists still call precommitment against your own weakness \"tying yourself to the mast.\"</p>",
 lore:"<p><span class=\"loretag\">World</span>Homer's Sirens are strangely un-described — he never even says what they look like; later tradition made them bird-women, and later still muddled them with mermaids (which is why \"siren\" now conjures a sea-maiden). \"Siren song\" became the standard phrase for any beautiful, ruinous lure, and Odysseus tied to the mast one of the most reproduced images from the entire poem.</p>",
 rels:[{id:"odysseus",label:"who hears and survives them"},{id:"circe",label:"who warns him"}]
},
{
 id:"scylla_charybdis", name:"Scylla & Charybdis", resp:"SILL-uh & kuh-RIB-diss", type:"thing", epic:"odyssey",
 essence:"The monster and the whirlpool guarding a narrow strait — the original impossible choice between two disasters, with no safe way through.",
 sections:[
  {h:"A strait with no good option", body:"[[circe|Circe]] warns [[odysseus|Odysseus]] that his route home runs through a narrow channel flanked by two horrors: on one side Scylla, a six-headed monster lodged in a cliff who snatches sailors from passing ships; on the other Charybdis, a giant whirlpool that swallows the whole sea three times a day and would take an entire ship down with it."},
  {h:"The lesser evil", body:"There is no route that avoids both. [[circe|Circe]]'s brutal advice is to hug Scylla's cliff and accept losing six men to her jaws rather than risk losing everyone to the whirlpool. [[odysseus|Odysseus]] does exactly that — and must watch, helpless, as six of his crew are plucked screaming into the air. Sometimes leadership, the episode says, is just choosing which people you can't save."}
 ],
 lore:"<p><span class=\"loretag\">World</span>\"Between Scylla and Charybdis\" became the classic phrase for being trapped between two dangers where dodging one drives you onto the other — the ancient ancestor of \"between a rock and a hard place\" and \"the devil and the deep blue sea.\" The strait was traditionally placed at the Strait of Messina between Italy and Sicily, whose real currents and whirlpools surely fed the legend. It endures as the definitive image of the choice with no clean way out.</p>",
 rels:[{id:"odysseus",label:"who must pass between them"},{id:"circe",label:"who advises him"}]
},
{
 id:"penelope_shroud", name:"Penelope's Shroud", resp:"", type:"thing", epic:"odyssey",
 essence:"The burial cloth Penelope weaves by day and unravels by night — a masterpiece of stalling that holds off the suitors for three years.",
 sections:[
  {h:"The three-year trick", body:"Pressed by the [[antinous|suitors]] to remarry, [[penelope|Penelope]] buys herself time with a stratagem worthy of her missing husband: she announces she will choose a new husband only once she has finished weaving a fine burial shroud for her father-in-law [[laertes|Laertes]]. No one can fault so pious a duty."},
  {h:"Undone every night", body:"What the suitors don't know is that every night, by torchlight, [[penelope|Penelope]] quietly unravels the day's weaving. The shroud is never finished; the choice is endlessly deferred. She keeps the con running for three full years, until one of her own maids betrays the secret. It is cunning of exactly the kind [[odysseus|Odysseus]] would admire — patient, deceptive, and bought entirely with time."}
 ],
 mind:"<p>The shroud is the proof that [[penelope|Penelope]] is [[odysseus|Odysseus]]'s true match — <strong>cleverness as a form of resistance</strong>. With no army and no power, cornered in her own house, she fights the only way open to her: with patience and a trick, weaving and unweaving her own freedom night after night. It's heroism redefined as endurance.</p>",
 lore:"<p><span class=\"loretag\">World</span>\"Penelope's web\" entered the language as a proverb for any task deliberately kept unfinished, and the weaving-and-unweaving queen became a favorite emblem of both faithfulness and craft. Weaving is a recurring metaphor across these poems for storytelling and scheming alike — to \"weave\" a plan or a tale — which makes Penelope, quietly, a kind of artist, spinning out the plot of her own survival.</p>",
 rels:[{id:"penelope",label:"its weaver"},{id:"laertes",label:"its supposed recipient"},{id:"antinous",label:"the suitor it holds off"}]
},
{
 id:"olive_bed", name:"The Olive-Tree Bed", resp:"", type:"thing", epic:"odyssey",
 essence:"The marriage bed Odysseus built into a living olive tree — the unmovable secret that finally proves husband and wife to each other.",
 sections:[
  {h:"The secret of the bed", body:"Long ago, [[odysseus|Odysseus]] built his and [[penelope|Penelope]]'s marriage bed with his own hands around the trunk of a living olive tree, still rooted in the ground — one bedpost is the tree itself, so the bed literally cannot be moved. Only the two of them, and one old servant, ever knew."},
  {h:"The final test", body:"When [[odysseus|Odysseus]] returns, [[penelope|Penelope]] — burned by twenty years of false hope — refuses to believe it's really him. So she tests him: she casually orders the servants to move their bed out of the bedchamber. Odysseus erupts, demanding who cut through his olive-tree bedpost — and in that flash of real anger, she knows. No impostor could have known the secret. Only now does she finally let herself fall into his arms."}
 ],
 mind:"<p>The olive-tree bed is the Odyssey's deepest symbol of <strong>a marriage that endures</strong> — rooted, immovable, grown into the living earth. It is the perfect emblem of what [[odysseus|Odysseus]] chose over immortality: a bond as fixed and real as a tree, in place of a goddess's changeless paradise.</p><p><span class=\"mindtag\">Two minds, one trick</span>Note the beautiful reversal: [[penelope|Penelope]], the great deceiver's wife, catches the great deceiver with a trick of her own. She makes the master of disguise give himself away through the one thing he cannot fake — his knowledge of their shared, secret life. Their reunion is a meeting of equals in cunning.</p>",
 lore:"<p><span class=\"loretag\">World</span>The olive tree was sacred to [[athena|Athena]], Odysseus's divine patron, and central to Greek life — source of food, oil, and light, and an emblem of peace and of Athens itself. That the marriage at the heart of the Odyssey is literally built into an olive tree binds the couple's love to the deepest roots of the Greek world: household, homeland, and the goddess who watches over them both.</p>",
 rels:[{id:"penelope",label:"who tests him with it"},{id:"odysseus",label:"who built it"},{id:"ithaca",label:"where it's rooted"}]
},
{
 id:"helios_cattle", name:"The Cattle of the Sun", resp:"HEE-lee-os", type:"thing", epic:"odyssey",
 essence:"The Sun-god's sacred, deathless herds — the one thing Odysseus's men are forbidden to touch, and the temptation that drowns them all.",
 sections:[
  {h:"The forbidden herds", body:"On the island of [[thrinacia|Thrinacia]] graze the magnificent cattle of [[helios|the Sun]] — immortal, never breeding and never dying, tended by nymphs. [[tiresias|Tiresias]] and [[circe|Circe]] both warn [[odysseus|Odysseus]] with absolute clarity: leave them untouched and you may yet get home; harm them and you lose your ship and every last man."},
  {h:"Hunger wins", body:"Trapped on the island by contrary winds and reduced to starvation, [[odysseus|Odysseus]]'s crew — led by [[eurylochus|Eurylochus]] while their captain sleeps — slaughter and roast the sacred cattle. The meat itself seems cursed: the flayed hides crawl, the spitted flesh lows as it cooks. [[helios|Helios]] demands vengeance, [[zeus|Zeus]] wrecks the ship, and all are lost but Odysseus. It is the last and most fatal failure of the crew's self-control."}
 ],
 mind:"<p>The Cattle of the Sun are the Odyssey's plainest lesson in <strong>the cost of appetite over restraint</strong>. The men are warned, they grasp the stakes, and they do it anyway, driven by hunger — and unlike so many disasters in the poem, this one is nobody's fault but their own. Homer says as much in the very first lines: they perished \"through their own blind folly.\"</p>",
 lore:"<p><span class=\"loretag\">World</span>Sacred, untouchable herds belonging to a god were a real feature of ancient religion — animals set apart, protected by taboo, whose slaughter counted as sacrilege. The crew's crime would have struck Homer's audience as genuine impiety, not mere theft. The episode gives the poem its bluntest moral shape: a clear rule, a clear violation, and a clear, total punishment.</p>",
 rels:[{id:"thrinacia",label:"where they graze"},{id:"tiresias",label:"who warns against them"},{id:"circe",label:"who also warns of them"},{id:"odysseus",label:"whose crew they doom"},{id:"helios",label:"the Sun-god who owns them"}]
},
{
 id:"clytemnestra", name:"Clytemnestra", resp:"kly-tem-NESS-truh", type:"character", epic:"odyssey",
 aka:"Queen of Mycenae",
 essence:"Agamemnon's queen, who nurses her rage for a decade and cuts him down the day he comes home — the Odyssey's dark mirror to faithful Penelope.",
 sections:[
  {h:"Who she is", body:"Clytemnestra is the wife of [[agamemnon|Agamemnon]] and queen of [[mycenae|Mycenae]] — and, as it happens, the sister of [[helen|Helen]]. While her husband spends ten years at [[troy|Troy]], she takes a lover and lays her plans, and when Agamemnon finally sails home in triumph, she murders him in his own bath."},
  {h:"The motive", body:"Homer keeps her mostly offstage, but her reason looms over everything: before the war, [[agamemnon|Agamemnon]] sacrificed their daughter [[iphigenia|Iphigenia]] to buy his fleet a favorable wind. Clytemnestra's revenge is a mother's revenge, cold and patient — she waited the entire length of the war to take it."},
  {h:"The warning she becomes", body:"In the Odyssey her story works as the terrible counter-example. The ghost of [[agamemnon|Agamemnon]], met in the [[underworld|land of the dead]], bitterly warns [[odysseus|Odysseus]] to trust no woman and to come home in secret — because his own homecoming ended on his wife's blade. Clytemnestra is the shadow that makes [[penelope|Penelope]]'s faithfulness shine."}
 ],
 mind:"<p>Clytemnestra is the poem's study of <strong>the homecoming turned to horror</strong> — everything [[odysseus|Odysseus]]'s return might have been and isn't. Set beside [[penelope|Penelope]], she defines the Odyssey's central anxiety: what, exactly, is waiting for a man behind his own front door after twenty years away?</p><p><span class=\"mindtag\">Villain or avenger?</span>Homer casts her as the treacherous wife, but the fuller myth complicates it: she is also a mother avenging a murdered child. Later tragedy took her far more seriously than Homer does, making her one of the most formidable and morally vexed figures on the entire Greek stage.</p>",
 lore:"<p><span class=\"loretag\">World</span>Where Homer sketches her, the tragedians made her monumental. Aeschylus's \"Oresteia\" hands Clytemnestra some of the most powerful speeches in Greek drama and stages the full, agonizing chain of vengeance her act unleashes — her son Orestes eventually killing her in turn to avenge his father. She became the archetype of the vengeful queen, and the vehicle for one of tragedy's great questions: in a cycle of just revenges, where does justice finally stop?</p>",
 rels:[{id:"agamemnon",label:"husband she kills"},{id:"iphigenia",label:"daughter, her grievance"},{id:"mycenae",label:"her kingdom"},{id:"penelope",label:"the faithful wife she's set against"}]
},
{
 id:"iphigenia", name:"Iphigenia", resp:"if-ih-juh-NY-uh", type:"character", epic:"iliad",
 essence:"Agamemnon's daughter, sacrificed by her own father to buy a favorable wind for the war — the innocent life at the root of the whole bloody chain.",
 sections:[
  {h:"Who she is", body:"Iphigenia is the young daughter of [[agamemnon|Agamemnon]] and [[clytemnestra|Clytemnestra]]. Before the Greek fleet can even sail for [[troy|Troy]], it is pinned in harbor by dead winds sent by the angry goddess [[artemis|Artemis]] — and the price the goddess sets to release them is the life of Agamemnon's own daughter."},
  {h:"The sacrifice", body:"[[agamemnon|Agamemnon]], choosing his command over his child, has Iphigenia summoned on the false pretext of a marriage to [[achilles|Achilles]] — and kills her on the altar instead. In some tellings the girl goes to her death bravely; in all of them, the great war begins with a father murdering his daughter. It is the original sin the whole story is built upon."},
  {h:"The consequences", body:"Nothing about her death stays buried. Her mother [[clytemnestra|Clytemnestra]] never forgives it, and repays it a decade later by murdering [[agamemnon|Agamemnon]] the very day he returns. Iphigenia is the first life spent on this war, and the one that poisons her father's house for two more generations."}
 ],
 mind:"<p>Iphigenia embodies <strong>the innocent crushed by others' ambitions</strong> — the child sacrificed, quite literally, so that grown men can wage a war over a marriage that was never hers. Her death poses the question the whole saga circles: what is any victory worth, if this is the price of it?</p><p><span class=\"mindtag\">The first cost</span>She stands at the head of the entire tragic chain. Every later horror — Agamemnon's murder, the curse that grips his house — flows from this one altar. Homer's world runs on the grim logic that blood demands blood, and Iphigenia is where the accounting begins.</p>",
 lore:"<p><span class=\"loretag\">World</span>Iphigenia's sacrifice became one of the most painful and contested images in Greek art and drama; Euripides devoted two plays to her, and one celebrated ancient painter, unable to depict a grief so extreme, famously showed her father with his face buried in his cloak. Her story has been retold as opera, tragedy, and poem for over two thousand years, always as the same unanswerable question about the human cost of war — a question that has not aged a day.</p>",
 rels:[{id:"agamemnon",label:"father who sacrifices her"},{id:"clytemnestra",label:"mother who avenges her"},{id:"artemis",label:"goddess who demands her"},{id:"calchas",label:"who names the price"}]
},
{
 id:"calchas", name:"Calchas", resp:"KAL-kas", type:"character", epic:"iliad",
 essence:"The Greek army's seer — the man who keeps delivering prophecies nobody wants to hear, beginning with the one that ignites the whole quarrel.",
 sections:[
  {h:"Who he is", body:"Calchas is the chief prophet of the Greek army, the interpreter of omens and the will of the gods. His readings are always right and almost always unwelcome — being the bearer of divine bad news is essentially his entire job description."},
  {h:"The dangerous truths", body:"It is Calchas who reveals that the plague ravaging the camp comes from [[apollo|Apollo]], and that [[agamemnon|Agamemnon]] must return his captive [[chryseis|Chryseis]] to end it — the disclosure that touches off the fatal quarrel with [[achilles|Achilles]]. Earlier, it was Calchas who named the terrible price of sailing at all: the sacrifice of [[iphigenia|Iphigenia]]. He tells the truth, and lets kings deal with the fallout."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Calchas is the type of the seer caught between a hard truth and a powerful, angry audience — a recurring and thankless role in Greek myth. Legend gave him a fittingly ironic end: it was foretold he would die the day he met a prophet greater than himself, and so he did, reportedly dying of sheer chagrin after losing a riddling contest to a rival seer. Even the man who knew everything didn't see that one coming.</p>",
 rels:[{id:"agamemnon",label:"whose plague he explains"},{id:"chryseis",label:"whose return he demands"},{id:"apollo",label:"whose will he reads"},{id:"iphigenia",label:"whose sacrifice he named"}]
},
{
 id:"chryseis", name:"Chryseis", resp:"kry-SAY-iss", type:"character", epic:"iliad",
 essence:"The captive girl whose return Agamemnon refuses — the small human spark that lights the plague, the quarrel, and the entire Iliad.",
 sections:[
  {h:"Who she is", body:"Chryseis is the daughter of a priest of [[apollo|Apollo]], captured by the Greeks and awarded to [[agamemnon|Agamemnon]] as a war-prize. She barely appears in person, and yet the whole poem pivots on her: everything begins with her father coming to beg for her back."},
  {h:"The spark", body:"When [[agamemnon|Agamemnon]] harshly refuses the ransom and insults the old priest, [[apollo|Apollo]] answers with a devastating plague. Forced at last to give Chryseis up, Agamemnon salvages his wounded pride by seizing [[achilles|Achilles]]'s prize [[briseis|Briseis]] instead — and that theft drives Achilles from the war. Chryseis is returned to her father and vanishes from the story, having unknowingly set the entire tragedy in motion."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Chryseis and [[briseis|Briseis]] — the near-rhyming names are no accident, both meaning in effect \"daughter of\" their fathers — underscore how completely these women are defined by the men around them rather than by themselves. Between them they set off the Iliad's whole plot without ever once being asked what they might want. That near-invisibility is precisely what modern retellings have set out to correct.</p>",
 rels:[{id:"agamemnon",label:"her captor, forced to free her"},{id:"apollo",label:"her father's god"},{id:"calchas",label:"who demands her return"},{id:"briseis",label:"seized in her place"}]
},
{
 id:"deiphobus", name:"Deiphobus", resp:"dee-IFF-uh-bus", type:"character", epic:"iliad",
 essence:"A brave Trojan prince — Hector's brother, whose very face the gods borrow to trick Hector into his final, fatal stand.",
 sections:[
  {h:"Who he is", body:"Deiphobus is one of the many sons of [[priam|Priam]] and a brother of [[hector|Hector]] and [[paris|Paris]] — a capable Trojan warrior who fights hard throughout the war, if always in the long shadow of his greater brother."},
  {h:"The fatal trick", body:"His most important moment isn't really his at all. In [[hector|Hector]]'s last stand against [[achilles|Achilles]], the goddess [[athena|Athena]] disguises herself as Deiphobus and appears at Hector's side, seeming to offer a brother's help against the terrifying Achilles. Emboldened, Hector turns to fight — and discovers, too late, that \"Deiphobus\" has vanished and the gods have played him false. That deception is what finally traps Hector into his death."}
 ],
 lore:"<p><span class=\"loretag\">World</span>In the tradition after the war, Deiphobus takes an even darker turn: following [[paris|Paris]]'s death he marries [[helen|Helen]], and when the city falls he is betrayed and killed — in some versions by Helen's own hand, guiding [[menelaus|Menelaus]] to him. Virgil's [[aeneas|Aeneas]] later meets his mutilated ghost in the underworld. He is a reminder of how many lesser Trojan lives the great story quietly consumes on its way to its famous ending.</p>",
 rels:[{id:"hector",label:"brother whose shape dooms him"},{id:"priam",label:"father"},{id:"paris",label:"brother"},{id:"helen",label:"his later wife"},{id:"athena",label:"who wears his face"}]
},
{
 id:"polydamas", name:"Polydamas", resp:"puh-LID-uh-mas", type:"character", epic:"iliad",
 essence:"The Trojan who always gives the wise, cautious advice — and whom Hector, to his ruin, refuses to heed at the one moment it mattered most.",
 sections:[
  {h:"Who he is", body:"Polydamas is a Trojan commander, born (Homer tells us) on the very same night as [[hector|Hector]] — and cast as his opposite. Where Hector is bold, Polydamas is prudent: the level-headed voice of caution, gifted in counsel where Hector excels in war."},
  {h:"The advice ignored", body:"Again and again, Polydamas urges restraint — most crucially, he warns [[hector|Hector]] to pull the Trojan army back inside the city walls now that [[achilles|Achilles]] has returned to the field. Hector, too proud and too stung by the thought of looking timid, overrules him and keeps the army out in the open. The result is catastrophe: the Trojans are routed, and Hector himself is killed. In his last moments, Hector bitterly remembers that he should have listened."}
 ],
 mind:"<p>Polydamas is the <strong>counterfactual made flesh</strong> — the sensible path standing quietly beside the proud man who won't take it. He exists so that Hector's downfall reads not as bad luck but as a choice, made over and over against a wiser voice he simply couldn't bear to heed.</p>",
 lore:"<p><span class=\"loretag\">World</span>Polydamas is Homer's figure for the sound advice the hero cannot bring himself to take — a role that recurs all through literature, from the ignored counselor to the friend who saw it coming. His pairing with Hector, born the same night like two halves of one nature (nerve and caution), is a small masterpiece of design: the poem quietly suggests that Hector's deadliest enemy was not Achilles but his own pride, and that the warning was always standing right there beside him.</p>",
 rels:[{id:"hector",label:"who ignores his counsel"}]
},
{
 id:"dolon", name:"Dolon", resp:"DOH-lon", type:"character", epic:"iliad",
 essence:"A greedy Trojan spy whose one night of ambition ends in a ditch — caught, wrung dry, and killed on a dark reconnaissance gone wrong.",
 sections:[
  {h:"Who he is", body:"Dolon is a Trojan volunteer who, tempted by the promise of [[achilles|Achilles]]'s divine horses as his reward, slips out at night to spy on the Greek camp. He is not much of a warrior — the reward is really the point for him — and the mission goes wrong almost at once."},
  {h:"The night raid", body:"He runs straight into [[odysseus|Odysseus]] and [[diomedes|Diomedes]], out on a night raid of their own. They chase him down, and the terrified Dolon, begging for his life, spills every Trojan secret he knows in hopes of ransom — including where a newly arrived allied king sleeps, undefended. The two Greeks extract everything useful, kill him anyway, and go on to raid the very camp he betrayed. His greed earns him nothing but a cold end in the dark."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The whole grim night episode (an entire book of the Iliad, and sometimes thought a later addition) is the poem's one real venture into espionage and ambush rather than open battle — a darker, more ruthless kind of warfare, conducted by night and settled by deception. Dolon, the greedy amateur out of his depth, is its casualty, and a pointed contrast to the professionals who catch him: in this war, cleverness and nerve survive the dark, and wishful ambition does not.</p>",
 rels:[{id:"odysseus",label:"who catches him"},{id:"diomedes",label:"who kills him"}]
},
{
 id:"aeolus", name:"Aeolus", resp:"ee-OH-lus", type:"character", epic:"odyssey",
 essence:"The genial keeper of the winds — who hands Odysseus a shortcut home in a bag, then slams the door when the crew's greed throws it all away.",
 sections:[
  {h:"Who he is", body:"Aeolus is the master of the winds, living on a floating island, appointed by [[zeus|Zeus]] to keep the gales bottled up and release them as needed. He receives [[odysseus|Odysseus]] warmly, feasts him for a full month, and sends him off with an extraordinary parting gift."},
  {h:"The bag of winds", body:"Aeolus ties up all the storm-winds in a leather [[wind_bag|bag]] and gives it to [[odysseus|Odysseus]], leaving out only the gentle west wind to blow him straight home. It works perfectly — [[ithaca|Ithaca]] itself comes into view — until the exhausted Odysseus falls asleep and his crew, convinced the bag is stuffed with hidden gold, open it. The winds burst out and blow them all the way back. When Odysseus returns to beg a second time, Aeolus wants nothing to do with a man so obviously cursed by the gods, and turns him away."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Aeolus lent his name to everything wind-related — the \"Aeolian\" harp that sings in a breeze, the \"aeolian\" landforms carved by wind. His episode is one of the Odyssey's sharpest little parables about how the crew, not any monster, is so often the true obstacle: home was literally in sight, undone by nothing grander than suspicion and greed. Sometimes the wind you can't master is the one blowing through your own men.</p>",
 rels:[{id:"odysseus",label:"whom he helps, then abandons"},{id:"wind_bag",label:"his gift"},{id:"ithaca",label:"the home it nearly reached"}]
},
{
 id:"elpenor", name:"Elpenor", resp:"el-PEE-nor", type:"character", epic:"odyssey",
 essence:"The youngest of Odysseus's crew, who dies in the most undignified way imaginable — and still manages one last, touching request from beyond the grave.",
 sections:[
  {h:"Who he is", body:"Elpenor is the youngest and least distinguished member of [[odysseus|Odysseus]]'s crew — \"not very brave in war nor very sound of mind,\" as Homer bluntly puts it. His entire claim to fame is the manner of his death."},
  {h:"A fall and a favor", body:"On [[circe|Circe]]'s island, Elpenor drinks too much and falls asleep on the roof; startled awake as the crew departs, he tumbles off and breaks his neck, dying unnoticed. When [[odysseus|Odysseus]] descends to the [[underworld|land of the dead]] soon after, the very first ghost he meets is Elpenor's — still unburied back on the island, begging not to be left that way. Odysseus returns and gives him a proper funeral. Even the least of the crew, the poem insists, deserves that much."}
 ],
 mind:"<p>Elpenor is Homer's tenderness toward <strong>the unimportant dead</strong>. He does nothing heroic — he's just a young man who drank too much and fell off a roof. That the poem stops, in the middle of a journey to the underworld, to make sure his body is buried and his name remembered says a great deal about whom Homer thinks worth grieving: everyone.</p>",
 lore:"<p><span class=\"loretag\">World</span>Elpenor is a small masterstroke of humane detail. He does nothing heroic, dies almost comically, and yet Homer pauses the whole poem to make sure he is mourned and buried — a quiet insistence that dignity in death isn't reserved for the great. Poets have loved him for exactly this; Ezra Pound placed Elpenor near the very start of his \"Cantos,\" the first voice from the dead, precisely because he is so ordinary and so unforgotten.</p>",
 rels:[{id:"odysseus",label:"his captain"},{id:"circe",label:"at whose house he dies"},{id:"underworld",label:"where his ghost appears"},{id:"aeaea",label:"where he is finally buried"}]
},
{
 id:"eurylochus", name:"Eurylochus", resp:"yoo-RIL-uh-kus", type:"character", epic:"odyssey",
 essence:"Odysseus's second-in-command — cautious, mistrustful, and the crewman whose fatal choices help doom his shipmates.",
 sections:[
  {h:"Who he is", body:"Eurylochus is [[odysseus|Odysseus]]'s kinsman and second-in-command, the one who leads the scouting party on [[circe|Circe]]'s island — and the only man to hang back, escape being turned into a pig, and raise the alarm. He is cautious to the point of suspicion, and often at odds with his captain's bolder instincts."},
  {h:"The fatal mutiny", body:"His caution curdles into disaster on the island of [[thrinacia|Thrinacia]]. When [[odysseus|Odysseus]] wants to sail straight past without landing, Eurylochus argues the exhausted crew down and forces a stop; then, when they are trapped and starving, it is Eurylochus who persuades the men to slaughter the forbidden [[helios_cattle|cattle of the Sun]] — the sacrilege that gets every last one of them destroyed. He means to save the crew, and instead damns them."}
 ],
 mind:"<p>Eurylochus is the <strong>enemy within</strong> — not a monster or a god, but a frightened, exhausted, hungry man whose reasonable-sounding panic dooms everyone. Through him the Odyssey makes a quiet, bitter point about leadership: the hardest thing to steer past isn't Scylla or the Cyclops, it's your own crew.</p>",
 lore:"<p><span class=\"loretag\">World</span>Eurylochus is the Odyssey's study of the well-meaning subordinate whose judgment is just wrong enough to be lethal — not a villain, simply a man whose fear and short-term reasoning override the one voice that would have saved them. He embodies a hard truth the poem keeps returning to: [[odysseus|Odysseus]] survives and his men don't, and the difference is not only luck but the discipline to resist the easy, disastrous choice.</p>",
 rels:[{id:"odysseus",label:"his captain and kinsman"},{id:"circe",label:"whose house he flees"},{id:"helios_cattle",label:"the sin he leads"},{id:"thrinacia",label:"where he dooms the crew"}]
},
{
 id:"alcinous", name:"Alcinous", resp:"al-SIN-oh-us", type:"character", epic:"odyssey",
 aka:"King of the Phaeacians",
 essence:"The generous king of the Phaeacians — the ideal host, whose hospitality finally carries Odysseus home, and whose court hears the hero's whole tale.",
 sections:[
  {h:"Who he is", body:"Alcinous is king of the Phaeacians, a prosperous, peaceful, seafaring people on the island of [[scheria|Scheria]], and the father of [[nausicaa|Nausicaa]]. When the shipwrecked [[odysseus|Odysseus]] arrives at his court, Alcinous receives him with lavish, unquestioning hospitality — the very model of how a good king should treat a stranger."},
  {h:"The frame of the tale", body:"His court is where much of the Odyssey actually gets told. Over feasting and games, Alcinous asks his mysterious guest to name himself — and [[odysseus|Odysseus]] answers with the entire first-person account of his wanderings, from the [[polyphemus|Cyclops]] to the [[underworld|land of the dead]]. Most of the poem's famous adventures reach us as a story Odysseus tells at Alcinous's table. In the end the king loads him onto a ship heavy with gifts and sends him home at last."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The Phaeacians represent a kind of fantasy of the perfectly civilized society — rich, gentle, expert sailors whose ships need no steering — the exact opposite of the savage [[polyphemus|Cyclopes]]. Their generosity to Odysseus is so complete that [[poseidon|Poseidon]], still nursing his grudge, punishes them for it, turning their returning ship to stone within sight of home. Even flawless hospitality, in the Odyssey, can carry a cost when a god is angry.</p>",
 rels:[{id:"nausicaa",label:"his daughter"},{id:"odysseus",label:"his honored guest"},{id:"scheria",label:"his kingdom"},{id:"demodocus",label:"the bard of his court"}]
},
{
 id:"demodocus", name:"Demodocus", resp:"dee-MOD-uh-kus", type:"character", epic:"odyssey",
 essence:"The blind bard of the Phaeacian court — a singer of the Trojan War whose songs move Odysseus, listening in disguise, to tears.",
 sections:[
  {h:"Who he is", body:"Demodocus is the blind court poet of the Phaeacians, who entertains King [[alcinous|Alcinous]]'s hall with songs of gods and heroes. He is a figure of real honor — the Muse, Homer says, loved him and gave him the gift of song even as she took his sight."},
  {h:"The song that undoes the hero", body:"At the feast, Demodocus sings of the [[trojan_horse|wooden horse]] and the fall of [[troy|Troy]] — not knowing that the stranger at the table is [[odysseus|Odysseus]] himself, who devised it. Hearing his own deeds sung back to him, Odysseus weeps and hides his face, and it is this reaction that finally prompts [[alcinous|Alcinous]] to ask who he really is. A song about the hero is what draws the hero out."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Blind Demodocus, singing of a war he never saw to a court that reveres him, has long been read as Homer's portrait of himself — the very tradition that Homer too was blind may spring partly from this scene. It is a rare, self-aware moment: the poem showing a poet at work, and quietly making the case for what poetry is <em>for</em>. Song, here, is how great deeds survive — and how even the men who did them come to feel their full weight.</p>",
 rels:[{id:"alcinous",label:"at whose court he sings"},{id:"odysseus",label:"whose deeds he sings"},{id:"scheria",label:"his home"}]
},
{
 id:"argos", name:"Argos", resp:"AR-goss", type:"character", epic:"odyssey",
 aka:"Odysseus's dog",
 essence:"Odysseus's old hunting dog — who waits twenty years for his master, knows him through the disguise at a single glance, and then, content at last, dies.",
 sections:[
  {h:"Who he is", body:"Argos is [[odysseus|Odysseus]]'s faithful hunting dog, a fine young hound when his master sailed for [[troy|Troy]]. Twenty years later, when [[odysseus|Odysseus]] returns disguised as a beggar, Argos is a neglected old dog lying half-forgotten on a dung heap outside the palace, riddled with ticks and too weak even to rise."},
  {h:"The recognition", body:"Yet Argos knows him at once. As [[odysseus|Odysseus]] passes — unable to acknowledge the dog without giving himself away — Argos manages only to drop his ears and wag his tail, and then, his long wait finally over, he dies. Odysseus, forced to walk on, has to turn his face aside to hide a tear. In a poem full of grand recognitions, the truest one belongs to a dog."}
 ],
 mind:"<p>Argos is one of literature's most devastating small moments — a whole meditation on <strong>loyalty, time, and loss</strong> compressed into a handful of lines. The dog recognizes Odysseus instantly, where clever humans need scars and secret signs; devotion sees straight through the disguise that fools everyone else.</p><p><span class=\"mindtag\">The cost of the years</span>Argos also embodies everything the twenty years took. He is the household's decline made flesh — neglected, aged past use — and his death at the very moment his master comes home is Homer's quiet way of saying that some things waited for cannot be gotten back.</p>",
 lore:"<p><span class=\"loretag\">World</span>The death of Argos is one of the most beloved and most-quoted passages in all of Homer, endlessly cited as literature's earliest and finest portrait of a dog's love — and its readers have been reliably reduced to tears for the better part of three thousand years. It is a remarkable thing for an epic of gods and heroes to pause for: a few lines on a dying dog that many readers remember longer than any of the battles.</p>",
 rels:[{id:"odysseus",label:"the master he waited for"},{id:"ithaca",label:"their home"}]
},
{
 id:"eurymachus", name:"Eurymachus", resp:"yoo-RIM-uh-kus", type:"character", epic:"odyssey",
 essence:"The smooth-talking suitor — second only to Antinous in arrogance, and a coward who tries to bargain and blame his way out the moment the killing starts.",
 sections:[
  {h:"Who he is", body:"Eurymachus is one of the two leading [[antinous|suitors]] besieging [[penelope|Penelope]], and the smoother of the pair — charming, plausible, and skilled at telling people exactly what they want to hear. Penelope's own household is half-fooled by him; the reader is not meant to be."},
  {h:"The coward's turn", body:"When [[odysseus|Odysseus]] reveals himself and the slaughter begins, Eurymachus shows his true colors instantly. He tries to talk his way out — pinning all the blame on the conveniently dead [[antinous|Antinous]] and offering to repay Odysseus for everything the suitors devoured. When that fails, he calls on the others to fight, and is among the first cut down. His fine words save him no better than they ever deserved to."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Eurymachus rounds out the Odyssey's anatomy of the suitors: where [[antinous|Antinous]] is openly brutal, Eurymachus is the slick hypocrite, and the poem plainly regards the second as no better than the first. His last-second attempt to buy his way out, blaming a dead man for a crime they all shared, is a small, cutting portrait of the smooth operator with nothing underneath — a type every age recognizes on sight.</p>",
 rels:[{id:"penelope",label:"whom he courts"},{id:"odysseus",label:"the king he wrongs"},{id:"antinous",label:"his fellow ringleader"}]
},
{
 id:"melanthius", name:"Melanthius", resp:"muh-LAN-thee-us", type:"character", epic:"odyssey",
 essence:"The disloyal goatherd who mocks and betrays his own master — and meets one of the grimmest ends in all of Homer.",
 sections:[
  {h:"Who he is", body:"Melanthius is a goatherd of [[ithaca|Ithaca]] who has thrown in with the [[antinous|suitors]] — the mirror-image of the loyal swineherd [[eumaeus|Eumaeus]]. Where Eumaeus keeps faith with his absent master, Melanthius openly sides with the men eating the household, currying favor with whoever holds power now."},
  {h:"The traitor's reward", body:"Encountering the disguised [[odysseus|Odysseus]], Melanthius insults and kicks the \"beggar,\" and during the final battle he sneaks arms to the suitors from the storeroom. His treachery earns him no mercy: he is caught, and dispatched with a brutality the poem does not flinch from. He is the disloyal servant as [[eumaeus|Eumaeus]]'s dark twin, and the Odyssey's justice for him is correspondingly harsh."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Melanthius and his sister Melantho (a disloyal maid) exist to sharpen the Odyssey's central theme of loyalty by supplying its opposite — and to justify the sweeping, unsettling reckoning at the poem's end. The severity of their punishment has long troubled readers, and marks the point where the Odyssey's cozy homecoming turns startlingly dark: restoring the rightful order, Homer suggests, is not a gentle business.</p>",
 rels:[{id:"odysseus",label:"the master he betrays"},{id:"eumaeus",label:"the loyal servant he mirrors"},{id:"antinous",label:"the suitors he arms"}]
},
{
 id:"philoetius", name:"Philoetius", resp:"fih-LEE-shus", type:"character", epic:"odyssey",
 essence:"The loyal cowherd who stands with Odysseus in the final fight — the third of the faithful servants who help win the house back.",
 sections:[
  {h:"Who he is", body:"Philoetius is the chief cowherd of [[ithaca|Ithaca]] and, like the swineherd [[eumaeus|Eumaeus]], one of the servants who has stayed loyal to the absent [[odysseus|Odysseus]] through all the long years. When the disguised hero tests him, Philoetius reveals that he still grieves for his lost master and despises the [[antinous|suitors]] who have taken over the house."},
  {h:"In the last battle", body:"His loyalty makes him one of the small, trusted band [[odysseus|Odysseus]] reveals himself to. Philoetius bars the courtyard gates to trap the suitors inside, then fights at his master's side through the slaughter. Alongside [[eumaeus|Eumaeus]] and [[telemachus|Telemachus]], he helps a single returned king overcome a whole hall of enemies."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Philoetius and [[eumaeus|Eumaeus]] together embody the Odyssey's conviction that faithfulness deserves reward: two humble herdsmen, loyal without any witness or expectation of return, end up the trusted comrades who help their king reclaim his home. In a poem sharply divided between the loyal and the treacherous, they are the quiet proof that Homer's world, for all its harshness, keeps a careful ledger of who kept faith.</p>",
 rels:[{id:"odysseus",label:"the master he stays true to"},{id:"eumaeus",label:"his fellow loyal servant"}]
},
{
 id:"phemius", name:"Phemius", resp:"FEE-mee-us", type:"character", epic:"odyssey",
 essence:"The bard of Ithaca, forced to sing for the suitors — who pleads for his life when Odysseus returns, and is spared for the sacred art he practices.",
 sections:[
  {h:"Who he is", body:"Phemius is the court poet of [[ithaca|Ithaca]], compelled to entertain the [[antinous|suitors]] in [[odysseus|Odysseus]]'s hall throughout the long occupation — singing for them, he insists, only under duress."},
  {h:"The bard's plea", body:"When [[odysseus|Odysseus]] slaughters the suitors, Phemius throws himself on the hero's mercy, arguing that he sang for the invaders against his will and that a poet, taught his craft by the gods, ought not to be killed. [[telemachus|Telemachus]] vouches for him, and Odysseus spares him, along with the herald Medon. Even amid the carnage, the poem carves out protection for the singer of tales."}
 ],
 lore:"<p><span class=\"loretag\">World</span>That [[odysseus|Odysseus]] spares the bard when he spares almost no one else is a telling moment — Homer, himself a singer of tales, quietly asserting the special, protected status of poetry even in a house running with blood. Phemius's defense — that his gift is god-given, and his songs serve whoever the times demand — reads almost as the poet's own apology for his art: a small, self-aware wink from a tradition thinking hard about its own worth.</p>",
 rels:[{id:"odysseus",label:"who spares him"},{id:"penelope",label:"whom his songs pain"},{id:"telemachus",label:"who vouches for him"}]
},
{
 id:"helios", name:"Helios", resp:"HEE-lee-os", type:"god", epic:"odyssey",
 aka:"the Sun-god",
 essence:"The all-seeing sun-god who drives his chariot across the sky — and whose sacred cattle, once slaughtered, doom Odysseus's last surviving crew.",
 sections:[
  {h:"Who he is", body:"Helios is the sun itself, driving his blazing chariot across the sky each day. Because he sees everything the daylight touches, myth casts him as a kind of universal witness — it is Helios who tells [[hephaestus|Hephaestus]] about [[aphrodite|Aphrodite]]'s affair, having watched the whole thing from overhead."},
  {h:"The cattle", body:"His fatal role in the Odyssey is his sacred herd on the island of [[thrinacia|Thrinacia]]. Both [[tiresias|Tiresias]] and [[circe|Circe]] warn [[odysseus|Odysseus]] in the strongest possible terms to leave the [[helios_cattle|cattle]] untouched. Trapped by foul weather and starving, his crew slaughter them anyway while he sleeps — and Helios demands [[zeus|Zeus]] destroy them all, threatening otherwise to take his light down and shine among the dead instead. Zeus obliges with a thunderbolt. It is the crew's last mistake."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Later Greeks often merged Helios with [[apollo|Apollo]] into a single god of sun and light, though Homer keeps them firmly separate. The Colossus of Rhodes — yet another of the Seven Wonders — was a giant statue of Helios, patron of that sun-drenched island. The cattle episode became a favorite ancient parable of the ruin that follows when hunger is allowed to override a clear, repeated warning.</p>",
 rels:[{id:"helios_cattle",label:"his sacred herd"},{id:"thrinacia",label:"his island"},{id:"zeus",label:"who avenges him"},{id:"odysseus",label:"whose crew offends him"}]
},
{
 id:"scamander", name:"Scamander", resp:"skuh-MAN-der", type:"god", epic:"iliad",
 aka:"Xanthus, the river of Troy",
 essence:"The river-god of Troy's own plain — who rises up in fury when Achilles chokes his waters with the dead, in one of the Iliad's strangest and most spectacular fights.",
 sections:[
  {h:"Who he is", body:"Scamander (called Xanthus by the gods) is the great river running across the plain of [[troy|Troy]], and the god who lives within it. For most of the poem he is simply the landscape the war is fought over — until [[achilles|Achilles]]'s rampage drags him into the fighting himself."},
  {h:"The river rebels", body:"On his killing spree after [[patroclus|Patroclus]]'s death, [[achilles|Achilles]] slaughters so many Trojans that their bodies clog and foul Scamander's stream. Disgusted and enraged, the river-god rears up in a roaring flood and tries to drown Achilles outright — a lone mortal against an entire river, and for a moment the river is winning. Only [[hephaestus|Hephaestus]]'s answering fire, boiling the water back into its banks, saves the hero's life."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The scene is among the Iliad's boldest: it makes the land itself physically recoil from the scale of the slaughter, as though nature can no longer stomach what men are doing on it. Real rivers still bearing the old names (the Karamenderes, ancient Scamander) flow across the plain in northwest Turkey where Troy once stood — one of the small, concrete threads binding Homer's myth to a findable place on the map.</p>",
 rels:[{id:"achilles",label:"whom he tries to drown"},{id:"troy",label:"the city he flows through"},{id:"hephaestus",label:"who beats him back with fire"}]
}
