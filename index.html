/* -------- BEFORE THE WAR -------- */
{
 phase:"before", title:"The Golden Apple",
 summary:"At a wedding of the gods, a golden apple marked \"for the fairest\" sparks a quarrel between three goddesses.",
 deeper:"<p>At the wedding of the sea-goddess [[thetis|Thetis]] to a mortal king — the very marriage that will one day produce [[achilles|Achilles]] — every god is invited except one: Eris, the goddess of Strife. Uninvited and unamused, she takes her revenge with a single object. She rolls a golden apple into the feast, inscribed with two words: <em>for the fairest</em>.</p><p>Three goddesses reach for it at once. [[hera|Hera]], queen of the gods; [[athena|Athena]], goddess of wisdom; and [[aphrodite|Aphrodite]], goddess of beauty — each certain the apple is hers by right. The quarrel is instant and unwinnable, and [[zeus|Zeus]], no fool, wants nothing to do with judging his own wife against two of his daughters. He passes the decision to an unlucky mortal instead.</p><p>It is the smallest imaginable beginning for the largest imaginable catastrophe: a party snub, a piece of fruit, three bruised egos — and, ten years and countless deaths later, a burning city. Homer's whole world runs on exactly this kind of disproportion.</p>",
 entities:["golden_apple","hera","athena","aphrodite"]
},
{
 phase:"before", title:"The Judgment of Paris",
 summary:"The Trojan prince Paris is asked to pick the fairest goddess. He's bribed with the world's most beautiful woman.",
 deeper:"<p>The mortal handed this impossible choice is [[paris|Paris]], a prince of [[troy|Troy]] tending sheep on a hillside. Each goddess, rather than trusting her looks, resorts to a bribe. [[hera|Hera]] offers power and dominion over kingdoms; [[athena|Athena]] offers wisdom and victory in war; [[aphrodite|Aphrodite]] offers the most beautiful woman in the world.</p><p>Paris — young, vain, and thinking with something other than his head — chooses beauty. He hands [[aphrodite|Aphrodite]] the [[golden_apple|apple]], and in doing so makes two of the most powerful beings in existence the eternal enemies of his city. The woman he has been promised is [[helen|Helen]], already married to a Greek king. Aphrodite, true to her word, will help him take her anyway.</p><p>The scene became one of the most painted in all of Western art — and a permanent shorthand for the choice whose short-term temptation blinds the chooser to its ruinous long-term cost.</p>",
 entities:["paris","aphrodite","helen"]
},
{
 phase:"before", title:"Helen Leaves for Troy",
 summary:"Paris carries Helen — already married to the Spartan king Menelaus — away to Troy.",
 deeper:"<p>Paris travels to [[sparta|Sparta]] as an honored guest of King [[menelaus|Menelaus]] — and repays that hospitality by leaving with his host's wife. Whether [[helen|Helen]] is seduced, abducted, or goes willingly, Homer keeps pointedly, permanently unclear; even in antiquity, no one could agree, and the poem seems to prefer it that way.</p><p>What is not in doubt is the scale of the offense. In this world the bond between guest and host, <em>xenia</em>, is sacred, guarded by [[zeus|Zeus]] himself — and Paris has shattered it in the most flagrant way possible. This is not merely a love affair; it is a violation of the deepest law binding civilized people together, and it demands an answer in blood.</p><p>The most beautiful woman in the world has just become the most expensive. Every Greek king had once sworn an oath to defend Helen's marriage. Now that oath comes due, all at once.</p>",
 entities:["helen","paris","menelaus"]
},
{
 phase:"before", title:"The Thousand Ships Sail",
 summary:"Menelaus and his powerful brother Agamemnon raise a vast Greek army to win Helen back.",
 deeper:"<p>[[menelaus|Menelaus]] calls in the oath, and his powerful brother [[agamemnon|Agamemnon]] swells a private grievance into a national war, assembling a vast coalition of Greek kings and heroes. But the great fleet cannot sail: the winds die away, becalmed by the anger of the goddess [[artemis|Artemis]].</p><p>The seer [[calchas|Calchas]] names her terrible price. [[agamemnon|Agamemnon]] must sacrifice his own daughter, [[iphigenia|Iphigenia]] — and he does it. He kills his child so that a thousand ships can catch the wind. Before a single Trojan has been faced, the expedition is already stained with the blood of an innocent, and a wife, [[clytemnestra|Clytemnestra]], has been handed a reason to hate her husband that will outlast the entire war.</p><p>The ships sail at last. The image — a thousand ships launched over one woman — became the very emblem of beauty's power to unleash catastrophe. The cost of this war has begun before the fighting even starts.</p>",
 entities:["agamemnon","menelaus","achilles","odysseus"]
},

/* -------- THE ILIAD -------- */
{
 phase:"iliad", title:"The Quarrel",
 summary:"Year nine. Agamemnon insults Achilles by seizing his war-prize Briseis. Achilles quits the war in fury.",
 deeper:"<p>The Iliad opens not with a battle but with a bureaucratic dispute that spirals into disaster — and its very first word is <em>rage</em>. Nine years into the siege, a plague from [[apollo|Apollo]] is ravaging the Greek camp, sent because [[agamemnon|Agamemnon]] refused to return a priest's captured daughter, [[chryseis|Chryseis]].</p><p>Forced by the army to give her back, [[agamemnon|Agamemnon]] restores his wounded pride by seizing [[achilles|Achilles]]'s own war-prize, the woman [[briseis|Briseis]], instead. It is a petty, catastrophic act of ego. Humiliated before the whole army, [[achilles|Achilles]] withdraws himself and his men from the war entirely — and has his mother [[thetis|Thetis]] persuade [[zeus|Zeus]] to make the Greeks lose without him, so they'll learn exactly how much they need him.</p><p>The greatest army in the world has just been sabotaged from within, by the vanity of its two greatest men. Everything that follows — every death for the rest of the poem — flows from this single quarrel over honor and a stolen prize.</p>",
 entities:["achilles","agamemnon","briseis","apollo","thetis"]
},
{
 phase:"iliad", title:"A Duel for Helen",
 summary:"Paris and Menelaus fight one-on-one to end the war — until Aphrodite cheats to save Paris.",
 deeper:"<p>For a brief, tantalizing moment, the whole war nearly resolves itself sensibly. [[paris|Paris]] and [[menelaus|Menelaus]] — the two men at the very root of it all — agree to settle the matter in single combat: winner takes [[helen|Helen]], and everyone else simply goes home. It is the reasonable solution the entire ten years should have had.</p><p>[[menelaus|Menelaus]] wins handily, seizing Paris by the helmet and hauling him across the ground. But [[aphrodite|Aphrodite]] snatches her favorite off the field in a cloud, depositing him safely back in Helen's bedroom before the killing blow can land. The gods, it turns out, are not ready for the war to end.</p><p>A truce is broken moments later by a treacherous arrow, and the slaughter resumes. Homer keeps dangling the possibility of peace — and keeps snatching it away, usually through some divine meddling, as if to insist that this war has a terrible momentum all its own.</p>",
 entities:["paris","menelaus","aphrodite","helen"]
},
{
 phase:"iliad", title:"Diomedes Wounds the Gods",
 summary:"With Athena's help, the Greek hero Diomedes rampages — and even wounds two immortals.",
 deeper:"<p>With [[achilles|Achilles]] sulking in his tent, another hero seizes the spotlight: [[diomedes|Diomedes]], young and favored by [[athena|Athena]], goes on a rampage across the battlefield in his great <em>aristeia</em> — a hero's shining hour of supreme excellence.</p><p>Empowered by the goddess, he does what almost no mortal dares. When [[aphrodite|Aphrodite]] swoops in to rescue her son [[aeneas|Aeneas]], Diomedes wounds her in the hand, sending her fleeing to Olympus in tears. Then he goes further still and stabs the war-god [[ares|Ares]] himself, who bellows like ten thousand men and flees howling to [[zeus|Zeus]] — who tells him, in effect, to stop whining.</p><p>For one glorious afternoon, a man makes the gods bleed. It is the Iliad at its most exhilarating — but the lesson is quietly humbling too: Diomedes triumphs only because a goddess permits it, and the moment she withdraws her favor, he wisely backs down. Even the greatest mortal glory is on loan.</p>",
 entities:["diomedes","athena","aphrodite","ares"]
},
{
 phase:"iliad", title:"Hector and Andromache",
 summary:"Between battles, Hector says a tender farewell to his wife and infant son.",
 deeper:"<p>Homer turns from the battlefield to a moment of almost unbearable tenderness. [[hector|Hector]], Troy's champion, comes in from the fighting to find his wife [[andromache|Andromache]] on the city wall, holding their baby son [[astyanax|Astyanax]].</p><p>She begs him not to go back — laying out, with painful clarity, exactly how his death will leave her a widow and their son a defenseless orphan. He knows she is right. But he cannot bear the shame of hanging back while other men fight, and he goes anyway. As he reaches for his boy, the baby shrieks in fright at the horsehair plume of his helmet — and Hector laughs, lifts it off, and holds his son, praying the child will grow up greater than his father.</p><p>It is the tenderest scene in the Iliad, and the most devastating, because we already know how it ends. This is what the war destroys: not abstractions, but this family, this baby, this ordinary love. Hector fights not for glory but for the people on that wall — and he will lose them, and they him.</p>",
 entities:["hector","andromache","astyanax"]
},
{
 phase:"iliad", title:"The Embassy to Achilles",
 summary:"As the Greeks lose badly, they beg Achilles to return. He refuses even mountains of treasure.",
 deeper:"<p>With the Greeks being driven back and slaughtered, a desperate [[agamemnon|Agamemnon]] finally swallows his pride — more or less — and sends an embassy to [[achilles|Achilles]], offering a staggering fortune, the return of [[briseis|Briseis]], and much more, if he will only rejoin the fight.</p><p>[[achilles|Achilles]] refuses. And his refusal is one of the most remarkable speeches in the poem: he questions the entire heroic system he has lived and killed by. Why die young for honor, he asks, if honor can simply be seized by a man like Agamemnon? What is any prize worth, weighed against a life? For a moment the Iliad's greatest warrior sounds like a man who has seen straight through the whole bloody game.</p><p>It is a genuine crisis of meaning at the heart of a war epic. But his wound is still too raw and his pride too fresh; he turns the offer down. And by refusing, he ensures the disaster will have to grow far, far worse — and cost him the one thing he cannot bear to lose — before he finally returns.</p>",
 entities:["achilles","odysseus","agamemnon"]
},
{
 phase:"iliad", title:"Hector Storms the Ships",
 summary:"Hector breaks through the Greek defenses and nearly burns their fleet — their only way home.",
 deeper:"<p>Without [[achilles|Achilles]], the Greek line finally buckles. [[hector|Hector]], blazing with confidence and backed by [[zeus|Zeus]]'s favor, smashes through the defenses and drives the Greeks all the way back to their beached ships — their one and only way home.</p><p>This is the point of maximum danger. If the ships burn, the army is stranded at [[troy|Troy]] forever, and the war is simply lost. Hector reaches the first vessel and calls for fire. The steady giant [[ajax|Ajax]] stands almost alone on the decks, leaping from ship to ship with an enormous pike, holding off the Trojans by sheer planted stubbornness as the flames creep closer.</p><p>The Greeks are one torch away from annihilation — and it is [[achilles|Achilles]]'s pride that has brought them here. His refusal has consequences he never imagined, and the person about to pay for them is the one he loves most in the world.</p>",
 entities:["hector","greekcamp","zeus"]
},
{
 phase:"iliad", title:"Patroclus Falls",
 summary:"Achilles lets Patroclus fight in his armor. Patroclus pushes too far and is killed by Hector.",
 deeper:"<p>Watching his comrades die and the ships burn, [[patroclus|Patroclus]] — the gentlest man in the poem — can bear it no longer. He begs [[achilles|Achilles]] to let him borrow his armor and lead his fresh troops into battle, just to frighten the Trojans back from the ships. [[achilles|Achilles]] agrees, with one condition: drive them from the ships, and then come straight back.</p><p>Patroclus does drive them back — and then, swept up in the fury of his own success, ignores the warning and pushes on to the very walls of [[troy|Troy]]. It is too far. [[apollo|Apollo]] himself strikes him from behind, dazed and defenseless, knocking the borrowed armor loose. A minor Trojan wounds him. And [[hector|Hector]] delivers the final blow.</p><p>The kindest character in the Iliad dies wearing another man's armor, far from the one who loved him. His death is the hinge on which the entire poem turns — and the grief it is about to unleash will prove more terrible than any army.</p>",
 entities:["patroclus","achilles","hector","apollo","achilles_armor"]
},
{
 phase:"iliad", title:"The Rage of Achilles",
 summary:"Destroyed by grief, Achilles returns — now fighting only to kill Hector, knowing it means his own death.",
 deeper:"<p>When the news reaches [[achilles|Achilles]], he collapses in the dirt, pouring ashes over his head, howling so terribly that his goddess mother [[thetis|Thetis]] hears him from the depths of the sea. His grief is total, and it curdles almost instantly into something monstrous.</p><p>His quarrel with [[agamemnon|Agamemnon]] evaporates — it means nothing now. He wants only one thing: to kill [[hector|Hector]], though he knows a prophecy that his own death must follow soon after Hector's. He no longer cares. [[thetis|Thetis]] brings him new divine [[achilles_armor|armor]] forged by [[hephaestus|Hephaestus]], and Achilles returns to the war transformed — no longer a sulking man of honor, but a force of pure, grief-maddened vengeance.</p><p>What follows is the most terrifying fighting in the poem. He chokes a river with corpses until the river-god himself rises to stop him; he shows no mercy and takes no ransom. The rage that opened the Iliad as wounded pride has become something far darker: the rage of unbearable loss, and only one thing will even briefly slake it.</p>",
 entities:["achilles","patroclus","thetis","hephaestus","achilles_armor"]
},
{
 phase:"iliad", title:"Achilles Kills Hector",
 summary:"Achilles chases Hector around Troy's walls and kills him, then defiles the body.",
 deeper:"<p>The two champions finally meet outside the walls of [[troy|Troy]], with the whole city watching from above. And [[hector|Hector]] — the bravest man in the poem — feels, for one entirely human moment, pure terror. He runs. Three times [[achilles|Achilles]] chases him around the city walls before Hector can find the courage to turn and stand.</p><p>He stands partly because he is tricked: [[athena|Athena]], disguised as his brother [[deiphobus|Deiphobus]], appears at his side to fight alongside him — then vanishes the instant he reaches for a second spear. Hector understands, in that moment, that the gods have marked him for death and left him utterly alone. He faces [[achilles|Achilles]] anyway, and dies asking only that his body be returned to his family.</p><p>[[achilles|Achilles]] refuses even that. Consumed by grief for [[patroclus|Patroclus]], he lashes Hector's corpse to his chariot and drags it round and round in the dust, day after day. His revenge is complete — and it brings him no peace whatsoever. The greatest warrior has become something less than human, and even the gods look on, appalled.</p>",
 entities:["achilles","hector","athena","troy"]
},
{
 phase:"iliad", title:"Priam Ransoms His Son",
 summary:"Troy's old king begs Achilles for Hector's body. Two enemies weep together — and the Iliad ends.",
 deeper:"<p>The Iliad ends not with the fall of Troy but with something far more surprising: an act of grace. Guided by the gods through the enemy camp at night, old King [[priam|Priam]] does the unthinkable. He enters the tent of the man who killed his son, kneels before [[achilles|Achilles]], and kisses the very hands that slaughtered so many of his children.</p><p>He begs for [[hector|Hector]]'s body — and asks [[achilles|Achilles]] to think of his own aged father, far away, who may also one day grieve a son. And something breaks open. [[achilles|Achilles]], who has been inhuman with rage, suddenly sees his own father, his own grief, in the broken old king before him. The two enemies weep together — one for a son, the other for a father and a lost friend — and then share a meal.</p><p>[[achilles|Achilles]] gives the body back. It is the closest the Iliad ever comes to peace: not victory, not revenge, but two men who have every reason to hate each other recognizing, for one night, their shared humanity. An epic that began in rage ends in pity — one of the supreme moments in all of literature.</p>",
 entities:["priam","achilles","hector"]
},

/* -------- THE FALL OF TROY -------- */
{
 phase:"fall", title:"The Death of Achilles",
 summary:"Paris, guided by Apollo, kills Achilles with an arrow to his one vulnerable spot — his heel.",
 deeper:"<p>The Iliad closes before Troy falls, but the legend continues — and [[achilles|Achilles]] does not survive the war he chose glory in. His mother's prophecy comes due: not long after killing [[hector|Hector]], he is brought down himself.</p><p>And the manner of it is bitterly ironic. The mightiest warrior of the age is killed not in single combat with a worthy rival, but by an arrow from [[paris|Paris]] — the war's least heroic figure, the vain prince who started it all and mostly avoided the fighting — guided by [[apollo|Apollo]] to the one vulnerable spot on his body, his heel.</p><p>Achilles got exactly the bargain he was offered: a short life and undying fame. He is the greatest of heroes, remembered forever — and dead young, struck down by a coward's arrow. Later, meeting his ghost in the [[underworld|land of the dead]], [[odysseus|Odysseus]] will hear him say he would trade all that glory to be a poor man, alive. The prize he chose looks very different from the far side of death.</p>",
 entities:["achilles","paris","apollo"]
},
{
 phase:"fall", title:"The Trojan Horse",
 summary:"Odysseus's masterstroke: a giant hollow horse hides soldiers who open Troy's gates from within.",
 deeper:"<p>Ten years of siege, and [[troy|Troy]] still stands. So the Greeks abandon force for cunning — the specialty of [[odysseus|Odysseus]], whose idea this is. They build an enormous hollow wooden horse, hide their best warriors inside it, and appear to sail away, leaving the horse behind as an apparent parting gift to the gods.</p><p>The Trojans, giddy with relief that the war seems finally over, haul the great trophy inside their own walls — ignoring the priest who warns to fear Greeks bearing gifts, and the prophetess [[cassandra|Cassandra]], who screams that the horse is packed with soldiers and is, of course, believed by absolutely no one. That night, the hidden Greeks slip out and throw open the gates.</p><p>It is the most famous trick in history. The city that could not be taken in ten years of fighting falls in a single night to a piece of carpentry and a lie — and \"Trojan horse\" has meant a hidden, gift-wrapped danger ever since, right down to the malware on your computer.</p>",
 entities:["trojan_horse","odysseus","cassandra"]
},
{
 phase:"fall", title:"The Sack of Troy",
 summary:"The Greeks pour into the sleeping city and destroy it. Troy falls at last.",
 deeper:"<p>What follows is not glory but atrocity. With the gates thrown open, the Greeks pour into the sleeping city, and the sack of [[troy|Troy]] becomes the ancient world's great image of a whole civilization annihilated in a night.</p><p>Old King [[priam|Priam]] is butchered at his own altar, the sacred place that should have protected him. [[hector|Hector]]'s infant son [[astyanax|Astyanax]] is thrown from the walls, killed lest he grow up to avenge the city. The women — [[hecuba|Hecuba]], [[andromache|Andromache]], [[cassandra|Cassandra]] — are dragged into slavery, parceled out among the victors. The temples burn.</p><p>Homer's audience took no simple triumph in this. The later Greeks told the story of Troy's fall with real horror, aware that their own legendary ancestors were the ones committing the crimes — and that such crimes tend to draw the anger of the gods down on the victors in turn. Only [[aeneas|Aeneas]] escapes the ruin, carrying his old father out of the flames, bearing Troy's bloodline toward a distant future. For everyone else, this is the end of the world.</p>",
 entities:["troy","priam","andromache","aeneas"]
},
{
 phase:"fall", title:"The Long Way Home Begins",
 summary:"The victorious Greeks scatter across the sea. For Odysseus, the hardest journey is just starting.",
 deeper:"<p>Victory, it turns out, is not the same thing as a safe homecoming. The Greek fleet that sailed so triumphantly for Troy is scattered and shattered on the way back — partly by storms, partly by the anger of gods offended by the brutality of the sack.</p><p>The homecomings — the Greeks called them <em>nostoi</em> — go wrong in every possible way. [[agamemnon|Agamemnon]] reaches home only to be murdered by his wife [[clytemnestra|Clytemnestra]]. [[menelaus|Menelaus]] is blown all the way to Egypt. And [[odysseus|Odysseus]], who has enraged [[poseidon|Poseidon]] by blinding his son, is about to vanish for ten more years into a sea of monsters and marvels.</p><p>Here the saga pivots from the Iliad's world of battlefield glory to the Odyssey's world of survival, cunning, and the long ache of homesickness. The question is no longer who is the greatest warrior, but a humbler and harder one: who actually makes it home — and what is left of them when they do?</p>",
 entities:["odysseus","agamemnon","menelaus"]
},

/* -------- THE ODYSSEY -------- */
{
 phase:"odyssey", title:"Telemachus Comes of Age",
 summary:"Odysseus's son, tired of the suitors devouring his home, sets out to find news of his father.",
 deeper:"<p>The Odyssey begins, surprisingly, not with its hero but with his son. Twenty years after [[odysseus|Odysseus]] sailed for war, his house on [[ithaca|Ithaca]] is under siege of a different kind: a mob of [[antinous|suitors]] has moved in, devouring his wealth and pressuring his wife [[penelope|Penelope]] to declare him dead and remarry.</p><p>His son [[telemachus|Telemachus]], a baby when Odysseus left, is now a young man — but a powerless and passive one, unable to throw the freeloaders out of his own home. Prodded by the goddess [[athena|Athena]], he finally stirs himself, sailing off to [[pylos|Pylos]] and [[sparta|Sparta]] to seek news of his father and, without quite realizing it, to grow up.</p><p>This opening stretch — known as the \"Telemachy\" — is a coming-of-age story bolted onto the front of an adventure epic. It sharpens our hunger to meet the missing father before he ever appears, and it gives the boy the spine he'll need: because when [[odysseus|Odysseus]] finally comes home, father and son will have to retake the house together.</p>",
 entities:["telemachus","penelope","athena","antinous","nestor"]
},
{
 phase:"odyssey", title:"Odysseus on Calypso's Island",
 summary:"We find Odysseus trapped for seven years by a goddess who offers him immortality if he'll stay.",
 deeper:"<p>When we finally meet [[odysseus|Odysseus]], the great hero of Troy is not storming a citadel. He is sitting on a beach, weeping. For seven years he has been held on the paradise island of [[ogygia|Ogygia]] by the goddess [[calypso|Calypso]], who loves him and will not let him go.</p><p>She offers him everything: her bed, her beautiful island, and — the ultimate prize — immortality and eternal youth, if he will only stay. And he refuses. He would rather return to his rocky little kingdom, his aging mortal wife, and a life that ends, than live forever in a goddess's arms. It is the choice that defines him, and the whole poem.</p><p>Only when [[zeus|Zeus]] intervenes, sending [[hermes|Hermes]] with a direct order, does [[calypso|Calypso]] reluctantly release him. The message is unmistakable: what makes a human life precious is not that it goes on forever, but precisely that it doesn't — and that it is <em>yours</em>, lived among the people and the place you belong to.</p>",
 entities:["odysseus","calypso","ogygia","hermes","poseidon"]
},
{
 phase:"odyssey", title:"The Phaeacians",
 summary:"Shipwrecked, Odysseus is found by princess Nausicaa and taken in by a kindly people.",
 deeper:"<p>Released at last, [[odysseus|Odysseus]] is promptly shipwrecked one final time by [[poseidon|Poseidon]], and washes up naked and half-dead on the shore of [[scheria|Scheria]], land of the Phaeacians. There the poised young princess [[nausicaa|Nausicaa]] finds him and, unafraid, sends him on to her father's palace.</p><p>King [[alcinous|Alcinous]] and his court receive the ragged stranger with feasts, games, and gifts — hospitality done exactly right, the bright opposite of the [[antinous|suitors]] plundering Odysseus's own hall. When the blind bard [[demodocus|Demodocus]] sings of the Trojan War, the stranger quietly weeps into his cloak, and the king gently asks him who he is.</p><p>And so, at a Phaeacian banquet, [[odysseus|Odysseus]] finally tells his own story — the Cyclops, [[circe|Circe]], the land of the dead — the fantastical heart of the whole poem. Scheria is the airlock between the fairy-tale world of his wanderings and the real, dangerous world of home; the Phaeacians' parting gift is the magic ship that carries him, fast asleep, back to [[ithaca|Ithaca]] at last.</p>",
 entities:["odysseus","nausicaa","scheria"]
},
{
 phase:"odyssey", title:"The Cyclops",
 summary:"Odysseus tells how he blinded the man-eating giant Polyphemus — and cursed his own journey.",
 deeper:"<p>The most famous of Odysseus's own tales — and the one that dooms his entire voyage. Exploring a strange island, he and his men enter the cave of [[polyphemus|Polyphemus]], a one-eyed giant and a son of [[poseidon|Poseidon]], who traps them inside with a boulder and begins eating them two at a time.</p><p>[[odysseus|Odysseus]]'s cunning saves the rest. He gets the giant drunk, tells him his name is \"Nobody,\" and then drives a sharpened, fire-hardened stake into his single eye. When the blinded [[polyphemus|Polyphemus]] roars for help, his neighbors call out to ask who is hurting him — and he bellows that \"Nobody\" is killing him, so they shrug and wander off. The men escape by clinging to the bellies of his sheep.</p><p>But then [[odysseus|Odysseus]] makes his one fatal mistake. Safely aboard ship and unable to resist crowing, he shouts back his real name — handing the giant exactly what he needs to curse him. [[polyphemus|Polyphemus]] prays to his father [[poseidon|Poseidon]] for vengeance, and the sea-god grants it. The hero's greatest strength, his cleverness, is undone in a heartbeat by his second-greatest trait: his pride.</p>",
 entities:["odysseus","polyphemus","poseidon","cyclops_land"]
},
{
 phase:"odyssey", title:"Circe and the Land of the Dead",
 summary:"The witch Circe turns men to pigs, then sends Odysseus into the underworld for guidance.",
 deeper:"<p>The voyage grows stranger still. On the island of [[aeaea|Aeaea]], the witch-goddess [[circe|Circe]] turns a scouting party of Odysseus's men into pigs. Armed with the herb [[moly|moly]] from [[hermes|Hermes]], [[odysseus|Odysseus]] resists her magic — and the goddess, meeting a man she cannot enchant, becomes an ally instead. His crew stay a full, comfortable year.</p><p>Then [[circe|Circe]] sends him on the eeriest errand in the poem: to sail to the very edge of the world and consult the dead. In the gray [[underworld|land of the dead]], [[odysseus|Odysseus]] summons the ghosts with blood and meets the prophet [[tiresias|Tiresias]], who charts his way home. He also meets his own mother, dead in his absence; a bitter [[agamemnon|Agamemnon]]; and the shade of [[achilles|Achilles]], who says he would rather be a poor man's living slave than king over all the dead.</p><p>It is the poem's darkest and most haunting stretch — the hero's descent among the dead that every later epic, from Virgil to Dante, would imitate. And its lesson points straight back at Odysseus's own quest: the dead, given the choice, want exactly what he wants — to be alive again, and to go home.</p>",
 entities:["circe","moly","tiresias","underworld","achilles"]
},
{
 phase:"odyssey", title:"Sirens, Scylla, and the Sun's Cattle",
 summary:"Odysseus survives the Sirens and a monster-guarded strait — but his crew's hunger dooms them all.",
 deeper:"<p>The homeward run becomes a gauntlet of temptations and impossible choices. First the [[siren_song|Sirens]], whose deadly-beautiful singing lures sailors onto the rocks: [[odysseus|Odysseus]] plugs his crew's ears with wax and has himself lashed to the mast, so he alone can hear the song and live — the only man ever to do so.</p><p>Then the strait of [[scylla_charybdis|Scylla and Charybdis]], where there is no safe path, only a choice of disasters: [[odysseus|Odysseus]] steers close to the six-headed monster and must watch, helpless, as she plucks six of his men — the lesser of two catastrophes. Leadership, here, means choosing which of your people you cannot save.</p><p>Finally, the island of [[thrinacia|Thrinacia]]. Warned on pain of death not to touch the [[helios_cattle|cattle of the Sun]], his starving crew — led by [[eurylochus|Eurylochus]] while their captain sleeps — slaughter them anyway. [[zeus|Zeus]] shatters the ship with a thunderbolt, and every last man drowns. [[odysseus|Odysseus]] alone survives, washed up on [[calypso|Calypso]]'s island to begin the seven-year captivity the poem opened with. He comes home at last, as the prophecy warned, late and broken and alone.</p>",
 entities:["siren_song","scylla_charybdis","helios_cattle","thrinacia","zeus"]
},
{
 phase:"odyssey", title:"The Beggar in His Own Hall",
 summary:"Home at last but disguised as a beggar, Odysseus endures the suitors' cruelty and plans his revenge.",
 deeper:"<p>Home at last on [[ithaca|Ithaca]] — but home is not safe. Disguised by [[athena|Athena]] as a filthy old beggar, [[odysseus|Odysseus]] does not march in to reclaim his throne. He watches, and waits, and gathers information, hiding in plain sight inside his own house.</p><p>He goes first to the hut of his loyal swineherd [[eumaeus|Eumaeus]], who takes the ragged stranger in without knowing him — a slave showing more honor than the highborn men up at the palace. He reveals himself to his son [[telemachus|Telemachus]], and the two begin to plot. In the great hall he endures appalling abuse from the [[antinous|suitors]], who mock and kick and throw things at the \"beggar\" — sealing their own fate with every insult, since mistreating a helpless stranger is exactly the sin [[zeus|Zeus]] punishes.</p><p>Only two beings see through the disguise unbidden: his old nurse [[eurycleia|Eurycleia]], who knows him by a childhood scar, and his ancient dog [[argos|Argos]], who recognizes his master after twenty years, wags his tail once, and dies. The Odyssey's real weapons — patience, restraint, disguise — are winding tight. The trap is nearly set.</p>",
 entities:["odysseus","ithaca","eumaeus","telemachus","antinous","eurycleia"]
},
{
 phase:"odyssey", title:"The Contest of the Bow",
 summary:"Penelope announces a contest with Odysseus's great bow — which only the disguised king can win.",
 deeper:"<p>[[penelope|Penelope]] — who may or may not already suspect the truth — finally sets the [[antinous|suitors]] a challenge to end the endless courtship: she will marry whichever man can string [[odysseus|Odysseus]]'s great [[odysseus_bow|bow]] and shoot an arrow cleanly through a row of twelve axe-heads, as her husband once could.</p><p>One after another, the suitors strain and fail. Not one of them can even bend the mighty bow. Then the ragged \"beggar\" asks for a turn, to the suitors' jeering contempt — and strings it with one easy, practiced motion, sending the arrow singing straight through all twelve axes.</p><p>In that single instant, the disguise is over. Identity is proven not by a word but by a feat only the true man can perform: the beggar is the king, and the king is finally, unmistakably home. It is one of literature's great recognition scenes — and the suitors have just run out of time.</p>",
 entities:["penelope","odysseus_bow","odysseus","antinous"]
},
{
 phase:"odyssey", title:"The Slaughter of the Suitors",
 summary:"Odysseus reveals himself and, with his son and loyal servants, kills the suitors who plagued his home.",
 deeper:"<p>[[odysseus|Odysseus]] throws off his rags, leaps to the threshold with the great [[odysseus_bow|bow]], and turns it on the men who have spent years devouring his home. His first arrow takes the ringleader [[antinous|Antinous]] through the throat, mid-drink. The doors are barred; there is no escape.</p><p>What follows is a grim, thorough reckoning. Aided by [[telemachus|Telemachus]] and the two faithful herdsmen [[eumaeus|Eumaeus]] and [[philoetius|Philoetius]], and shielded by [[athena|Athena]], [[odysseus|Odysseus]] cuts down every last suitor. The smooth-talking [[eurymachus|Eurymachus]] tries to bargain his way out and dies anyway. The household is then purged of the servants who betrayed it, including the disloyal [[melanthius|Melanthius]]. Only the bard [[phemius|Phemius]] and the herald, who acted under compulsion, are spared.</p><p>It is violent and, to modern eyes, disturbing in its sheer completeness. But to Homer's audience it was justice: the suitors broke the sacred law of hospitality, plotted murder, and abused a guest, and the poem frames their deaths not as revenge but as order finally, brutally restored. The house is being cleansed — though the family is not yet quite whole.</p>",

{

    requestAnimationFrame(function(){ window.scrollTo(0,y); }); });

var popEl=null, popTermEl=null, popShowT=null, popHideT=null, popPinned=false;
function ensurePop(){ if(popEl)return;
  popEl=document.createElement('div'); popEl.id='pop';
  popEl.addEventListener('mouseenter',function(){ clearTimeout(popHideT); });
  popEl.addEventListener('mouseleave',function(){ if(!popPinned) scheduleHidePop(); });
  document.body.appendChild(popEl);
}
function showPop(term,pinned){ ensurePop(); var id=term.getAttribute('data-id'); var e=BYID[id]; if(!e)return;
  clearTimeout(popHideT); clearTimeout(popShowT);
  popTermEl=term; popPinned=!!pinned;
  popEl.innerHTML='<div class="pop-h"><b>'+esc(e.name)+'</b>'+
    (e.resp?' <span class="resp">'+esc(e.resp)+'</span>':'')+
    '<span class="pop-kind">'+KIND[e.type]+'</span></div>'+
    '<p class="pop-ess">'+esc(e.essence)+'</p>'+
    '<button class="pop-open" onclick="ent(\''+id+'\')">Open '+esc(e.name)+' \u2192</button>';
  popEl.classList.add('on');
  positionPop(term);
}
function positionPop(term){ if(!popEl)return; var r=term.getBoundingClientRect();
  var pw=popEl.offsetWidth, ph=popEl.offsetHeight, vw=innerWidth, vh=innerHeight, m=10;
  var left=Math.max(m, Math.min(r.left+r.width/2-pw/2, vw-pw-m));
  var top=r.top-ph-8; if(top<m) top=r.bottom+8;
  if(top+ph>vh-m) top=Math.max(m, vh-ph-m);
  popEl.style.left=left+'px'; popEl.style.top=top+'px';
}
function scheduleHidePop(){ clearTimeout(popHideT); popHideT=setTimeout(closePop,240); }
function closePop(){ clearTimeout(popShowT); clearTimeout(popHideT);
  if(popEl){ popEl.classList.remove('on'); } popTermEl=null; popPinned=false; }
document.addEventListener('mouseover',function(e){
  var t=e.target.closest?e.target.closest('.term'):null; if(!t)return;
  clearTimeout(popHideT); clearTimeout(popShowT);
  if(t===popTermEl && popEl && popEl.classList.contains('on'))return;
  popShowT=setTimeout(function(){ showPop(t,false); }, 110);
});
document.addEventListener('mouseout',function(e){
  var t=e.target.closest?e.target.closest('.term'):null; if(!t)return;
  clearTimeout(popShowT); if(!popPinned) scheduleHidePop();
});
/* Capture phase: while a popover is open, a click anywhere outside it should ONLY
   dismiss the popover. Swallow the click so it can't also toggle a beat, follow a
   link, tap a chip, or trigger anything underneath. */
document.addEventListener('click',function(e){
  if(!(popEl && popEl.classList.contains('on'))) return;        // nothing open: behave normally
  if(e.target.closest && e.target.closest('#pop')) return;      // clicks inside the popover work normally
  var term=e.target.closest && e.target.closest('.term');
  if(term && term===popTermEl) return;                          // re-tap on the active term: let it pin (desktop hover)
  e.preventDefault(); e.stopPropagation();
  if(e.stopImmediatePropagation) e.stopImmediatePropagation();
  closePop();                                                   // dismiss-only: consume the event entirely
},true);
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.term'):null;
  if(t){ e.preventDefault(); clearTimeout(popShowT);
    if(popTermEl===t && popEl && popEl.classList.contains('on') && popPinned) return;
    showPop(t,true); return; }              // tap/click = pinned, stays until dismissed
  if(popEl && popEl.classList.contains('on') && !(e.target.closest&&e.target.closest('#pop'))) closePop();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closePop(); }
  if((e.key==='Enter'||e.key===' ') && document.activeElement && document.activeElement.classList &&
     document.activeElement.classList.contains('term')){ e.preventDefault(); showPop(document.activeElement,true); }
});
addEventListener('scroll',function(){ if(popEl&&popEl.classList.contains('on')&&popTermEl)positionPop(popTermEl); },{passive:true});

/* layout state (computed once) */
var MP=null, MEDGES=null, MCRAD={}, WORLD={w:2600,h:1720};
function importance(e){return (e.rels?e.rels.length:0);}
function computeLayout(portrait){
 if(MP && LAYOUT_MODE===portrait)return;
 LAYOUT_MODE=portrait; applySky(portrait);
 MP={};
 // seed: spiral each cluster around its center; anchor at center
 CLUSTERS.forEach(function(c){
   var others=c.ids.filter(function(id){return id!==c.anchor;});
   MP[c.anchor]={x:c.cx,y:c.cy,cl:c.id};
   var n=others.length, R0=70+n*7;
   others.forEach(function(id,i){
     var ang=i*2.399963, rr=R0*Math.sqrt((i+1)/n); // golden-angle spiral
     MP[id]={x:c.cx+Math.cos(ang)*rr, y:c.cy+Math.sin(ang)*rr, cl:c.id};
   });
 });
 // build intra-cluster edges for springs + all edges for drawing
 var seen={}; MEDGES=[];
 ENTITIES.forEach(function(e){(e.rels||[]).forEach(function(r){
   if(!MP[r.id])return;
   var k=e.id<r.id?e.id+"|"+r.id:r.id+"|"+e.id;
   if(seen[k])return; seen[k]=1;
   MEDGES.push({a:e.id,b:r.id,intra:CLUSTER_OF[e.id]===CLUSTER_OF[r.id]});
 });});
 // relax (deterministic)
 var ids=Object.keys(MP), REP=5600, L=120, ITER=280;
 for(var it=0;it<ITER;it++){
   var fx={},fy={}; ids.forEach(function(id){fx[id]=0;fy[id]=0;});
   // repulsion (all pairs)
   for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){
     var A=MP[ids[i]],B=MP[ids[j]];
     var dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy; if(d2<1)d2=1;
     var d=Math.sqrt(d2); var f=REP/d2; if(f>8)f=8;
     var ux=dx/d,uy=dy/d;
     fx[ids[i]]+=ux*f; fy[ids[i]]+=uy*f; fx[ids[j]]-=ux*f; fy[ids[j]]-=uy*f;
   }
   // springs (intra only, keeps clusters coherent)
   MEDGES.forEach(function(ed){ if(!ed.intra)return;
     var A=MP[ed.a],B=MP[ed.b]; var dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)||1;
     var f=(d-L)*0.02; var ux=dx/d,uy=dy/d;
     fx[ed.a]+=ux*f; fy[ed.a]+=uy*f; fx[ed.b]-=ux*f; fy[ed.b]-=uy*f;
   });
   // pull to home center
   ids.forEach(function(id){ var c=CLUSTER_BY[MP[id].cl];
     fx[id]+=(c.cx-MP[id].x)*0.016; fy[id]+=(c.cy-MP[id].y)*0.016; });
   // integrate
   var damp=0.86;
   ids.forEach(function(id){ MP[id].x+=fx[id]*damp; MP[id].y+=fy[id]*damp; });
 }
 // cluster radius for nebula
 CLUSTERS.forEach(function(c){ var mr=60; c.ids.forEach(function(id){
   var d=Math.hypot(MP[id].x-c.cx,MP[id].y-c.cy); if(d>mr)mr=d; }); MCRAD[c.id]=mr+70; });
}

function easeStart(k){ easeK=k||0.2;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ VS=tVS;VX=tVX;VY=tVY;drawMap();scheduleSave();return; }
  if(easeRAF)return;
  function loop(){
    VS+=(tVS-VS)*easeK; VX+=(tVX-VX)*easeK; VY+=(tVY-VY)*easeK;
    if(Math.abs(tVS-VS)<0.0004 && Math.abs(tVX-VX)<0.25 && Math.abs(tVY-VY)<0.25){
      VS=tVS;VX=tVX;VY=tVY; drawMap(); easeRAF=null; scheduleSave();
    } else { drawMap(); easeRAF=requestAnimationFrame(loop); }
  }
  easeRAF=requestAnimationFrame(loop);
}
var hoverId=null, matchSet=null, expMode="map", raf2=null, anim=null;
var mapReady=false, saveTimer=null;
function scheduleSave(){ if(saveTimer)clearTimeout(saveTimer);
 saveTimer=setTimeout(function(){ try{ localStorage.setItem('wds_view',
   JSON.stringify({s:VS,x:VX,y:VY,m:LAYOUT_MODE})); }catch(e){} },350); }
function loadView(){ try{ var v=JSON.parse(localStorage.getItem('wds_view'));
 if(v&&v.m===LAYOUT_MODE&&isFinite(v.s)&&isFinite(v.x)&&isFinite(v.y)){
   VS=v.s;VX=v.x;VY=v.y;clampVS();return true; } }catch(e){} return false; }
function w2s(x,y){return {x:x*VS+VX, y:y*VS+VY};}
function fitView(){
 var pad=60;
 var sx=(mapW-pad*2)/WORLD.w, sy=(mapH-pad*2)/WORLD.h;
 VS=Math.min(sx,sy); if(VS<=0)VS=0.2;
 VX=(mapW-WORLD.w*VS)/2; VY=(mapH-WORLD.h*VS)/2;
}
function clampVS(){ VS=Math.max(0.14,Math.min(2.6,VS)); }

function wireExplore(){

 sizeMap();
 computeLayout(mapH>mapW*1.15);
 if(!mapReady){ if(!loadView()) fitView(); mapReady=true; }
 syncTarget();
 var q=document.getElementById('expq'); q.value="";
 q.oninput=function(){ var t=q.value.toLowerCase().trim();
   if(!t){matchSet=null;drawMap();return;}
   matchSet={}; var first=null;

   if(first)flyToNode(first,1.25); drawMap();
 };
 q.onkeydown=function(ev){ if(ev.key==='Enter'&&matchSet){var k=Object.keys(matchSet);if(k.length)ent(k[0]);} };

function onMapResize(){ if(VIEW!=='explore'||!mapCanvas)return; sizeMap();
 var portrait=mapH>mapW*1.15;
 if(portrait!==LAYOUT_MODE){ MP=null; computeLayout(portrait); if(!loadView())fitView(); syncTarget(); }
 drawMap(); }
function setMode(m){ expMode=m;
 document.getElementById('tmap').classList.toggle('on',m==='map');
 document.getElementById('tlist').classList.toggle('on',m==='list');

 document.getElementById('mapstage').querySelector('.map-ctrls').style.display='flex';

 else { lg.style.display='none'; lg.innerHTML=''; if(mapCanvas){sizeMap();drawMap();} }
}
function sizeMap(){ if(!mapCanvas)return;
 var r=mapCanvas.getBoundingClientRect(); mapW=r.width; mapH=r.height;
 mapDPR=Math.min(window.devicePixelRatio||1,2);
 mapCanvas.width=mapW*mapDPR; mapCanvas.height=mapH*mapDPR;
 mapCtx.setTransform(mapDPR,0,0,mapDPR,0,0);
}
function zoomBy(f){ zoomTargetAt(mapW/2,mapH/2,f); }
function zoomTargetAt(px,py,f){ var wx=(px-tVX)/tVS, wy=(py-tVY)/tVS; tVS*=f; clampT();
 tVX=px-wx*tVS; tVY=py-wy*tVS; easeStart(0.2); }
function zoomImmediate(px,py,f){ var wx=(px-VX)/VS, wy=(py-VY)/VS; VS*=f;
 VS=Math.max(0.14,Math.min(2.6,VS)); VX=px-wx*VS; VY=py-wy*VS; drawMap(); tVS=VS;tVX=VX;tVY=VY; }

/* ---- rendering ---- */
function drawMap(){
 if(!mapCtx)return;
 mapCtx.clearRect(0,0,mapW,mapH);
 // nebulae
 CLUSTERS.forEach(function(c){ var s=w2s(c.cx,c.cy); var R=MCRAD[c.id]*VS;
   var g=mapCtx.createRadialGradient(s.x,s.y,R*0.15,s.x,s.y,R);
   g.addColorStop(0,'rgba('+c.tint+',0.16)'); g.addColorStop(1,'rgba('+c.tint+',0)');
   mapCtx.fillStyle=g; mapCtx.beginPath(); mapCtx.arc(s.x,s.y,R,0,7); mapCtx.fill();
 });
 var hi=hoverId; var neigh={};
 if(hi){ MEDGES.forEach(function(ed){ if(ed.a===hi)neigh[ed.b]=1; if(ed.b===hi)neigh[ed.a]=1; }); }
 // edges: cross first (faint), then intra
 mapCtx.lineWidth=1;
 MEDGES.forEach(function(ed){ if(ed.intra)return; drawEdge(ed,hi,neigh,true); });
 MEDGES.forEach(function(ed){ if(!ed.intra)return; drawEdge(ed,hi,neigh,false); });
 // cluster titles
 var showTitles=VS<1.05;
 if(showTitles){ mapCtx.textAlign='center';
   CLUSTERS.forEach(function(c){ var s=w2s(c.cx,c.cy-MCRAD[c.id]+10);
     mapCtx.font='600 '+Math.max(12,Math.min(19,14*VS+8))+"px "+getFont();
     mapCtx.fillStyle='rgba('+c.tint+',0.85)';
     mapCtx.fillText(c.name.toUpperCase(),s.x,s.y);
   });
 }
 // nodes
 var ids=Object.keys(MP);
 ids.forEach(function(id){ var e=BYID[id]; var s=w2s(MP[id].x,MP[id].y);
   if(s.x<-40||s.x>mapW+40||s.y<-40||s.y>mapH+40)return;
   var isAnchor=CLUSTER_BY[MP[id].cl].anchor===id;
   var baseR=3+Math.min(importance(e),8)*0.55+(isAnchor?2.2:0);
   var r=baseR*Math.max(0.62,Math.min(1.5,VS));
   var col=EPICCOL[e.epic];
   var dim=false, glow=isAnchor?11:7;
   if(hi){ if(id===hi){glow=16;} else if(neigh[id]){glow=10;} else {dim=true;} }
   if(matchSet){ if(matchSet[id]){glow=15;} else {dim=true;} }
   mapCtx.save(); mapCtx.globalAlpha=dim?0.28:1;
   mapCtx.shadowColor=col; mapCtx.shadowBlur=glow;
   mapCtx.beginPath(); mapCtx.arc(s.x,s.y,r,0,7); mapCtx.fillStyle=col; mapCtx.fill();
   // sparkle cross on bigger stars
   if(r>4){ mapCtx.strokeStyle=col; mapCtx.lineWidth=1; mapCtx.beginPath();
     mapCtx.moveTo(s.x-r*2,s.y); mapCtx.lineTo(s.x+r*2,s.y);
     mapCtx.moveTo(s.x,s.y-r*2); mapCtx.lineTo(s.x,s.y+r*2); mapCtx.stroke(); }
   mapCtx.restore();
   // label
   var showLabel = (id===hi) || (matchSet&&matchSet[id]) || isAnchor || VS>1.02 ||
      (VS>0.62 && (e.type==='character'||e.type==='god'));
   if(showLabel && !(hi&&dim) ){
     mapCtx.font=(isAnchor?'600 ':'500 ')+(id===hi?13:12)+"px "+getFont();
     mapCtx.textAlign='center'; mapCtx.fillStyle=(id===hi||isAnchor)?'#ece3d0':'rgba(195,187,169,0.9)';
     mapCtx.globalAlpha=dim?0.3:1;
     mapCtx.fillText(clip(e.name,18), s.x, s.y - r - 6);
     mapCtx.globalAlpha=1;
   }
 });
}
function drawEdge(ed,hi,neigh,cross){
 var A=w2s(MP[ed.a].x,MP[ed.a].y), B=w2s(MP[ed.b].x,MP[ed.b].y);
 var on = hi && (ed.a===hi||ed.b===hi);
 var a;
 if(hi){ a = on ? 0.85 : (cross?0.03:0.06); }
 else { a = cross ? 0.10 : 0.30; }
 mapCtx.strokeStyle='rgba(198,144,73,'+a+')';
 mapCtx.lineWidth=on?1.6:1;
 mapCtx.beginPath(); mapCtx.moveTo(A.x,A.y); mapCtx.lineTo(B.x,B.y); mapCtx.stroke();
}

/* ---- fly-to animation ---- */
function fitTarget(){ var pad=60; var sx=(mapW-pad*2)/WORLD.w, sy=(mapH-pad*2)/WORLD.h;
 var s=Math.min(sx,sy); return {s:s, x:(mapW-WORLD.w*s)/2, y:(mapH-WORLD.h*s)/2}; }
function flyToCluster(cid){ var c=CLUSTER_BY[cid]; var s=Math.min(2.0,(Math.min(mapW,mapH)*0.42)/MCRAD[cid]);
 flyTo({s:s, x:mapW/2-c.cx*s, y:mapH/2-c.cy*s}); }
function flyToNode(id,s){ var p=MP[id]; if(!p)return; flyTo({s:s, x:mapW/2-p.x*s, y:mapH/2-p.y*s}); }
function flyTo(t){ tVS=Math.max(0.14,Math.min(2.6,t.s)); tVX=t.x; tVY=t.y; easeStart(0.16); }

/* ---- pointer: pan / pinch / tap / hover ---- */
function bindMapPointer(){
 var pts=new Map(), moved=false, downT=0, startAvg=null, startVS=VS, pinchD0=0;
 function avg(){ var xs=0,ys=0,n=0; pts.forEach(function(p){xs+=p.x;ys+=p.y;n++;}); return {x:xs/n,y:ys/n,n:n}; }
 mapCanvas.addEventListener('pointerdown',function(e){ mapCanvas.setPointerCapture(e.pointerId);
   pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); moved=false; downT=performance.now();
   syncTarget();                              // stop any glide; take direct control
   var a=avg(); startAvg=a; startVS=VS;
   if(pts.size===2){ var arr=[...pts.values()]; pinchD0=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y); }
   mapCanvas.classList.add('grabbing');
 });
 mapCanvas.addEventListener('pointermove',function(e){
   if(pts.has(e.pointerId)){ pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
     if(pts.size===1){ var p=[...pts.values()][0]; var dx=p.x-startAvg.x,dy=p.y-startAvg.y;
       if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
       if(moved){ VX+=(e.movementX||0); VY+=(e.movementY||0); tVX=VX; tVY=VY; drawMap(); }
     } else if(pts.size===2){ moved=true; var arr=[...pts.values()];
       var d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
       var mid={x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2};
       if(pinchD0>0){ zoomImmediate(mid.x,mid.y,d/pinchD0); pinchD0=d; }
     }
   } else { // hover (mouse only)
     var id=hitTest(e.offsetX,e.offsetY); if(id!==hoverId){hoverId=id;drawMap();
       mapCanvas.style.cursor=id?'pointer':'grab';}
   }
 });
 function up(e){ if(!pts.has(e.pointerId))return; var wasCount=pts.size; pts.delete(e.pointerId);
   if(pts.size<2)pinchD0=0;
   mapCanvas.classList.remove('grabbing');
   if(!moved && wasCount===1 && performance.now()-downT<600){
     var id=hitTest(e.offsetX,e.offsetY); if(id){ent(id);}
   } else if(moved){ scheduleSave(); }
 }
 mapCanvas.addEventListener('pointerup',up);
 mapCanvas.addEventListener('pointercancel',up);
 mapCanvas.addEventListener('wheel',function(e){ e.preventDefault();
   var f=e.deltaY<0?1.075:1/1.075;               // gentle per-notch step, eased
   zoomTargetAt(e.offsetX,e.offsetY,f); },{passive:false});
 mapCanvas.addEventListener('pointerleave',function(){ if(hoverId){hoverId=null;drawMap();} });
}
function hitTest(px,py){ var best=null,bd=1e9;
 var ids=Object.keys(MP);
 for(var i=0;i<ids.length;i++){ var s=w2s(MP[ids[i]].x,MP[ids[i]].y);
   var d=Math.hypot(px-s.x,py-s.y); if(d<bd){bd=d;best=ids[i];} }
 return bd<=18?best:null;
}

  a.innerHTML='<div class="ent">'+

    secs+mind+lore+rels+
    '</div>';
  a.classList.remove('fadein');void a.offsetWidth;a.classList.add('fadein');
  if(e.rels&&e.rels.length)drawConstellation(e);
}
function drawConstellation(e){
  var c=document.getElementById('constel');if(!c)return;
  var dpr=Math.min(devicePixelRatio||1,2),W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;var x=c.getContext('2d');x.scale(dpr,dpr);
  var cx=W/2,cy=H/2,R=Math.min(W,H)/2-54;
  var rels=e.rels;var pts=rels.map(function(r,i){var ang=-Math.PI/2+i*2*Math.PI/rels.length;
    return{x:cx+Math.cos(ang)*R,y:cy+Math.sin(ang)*R,r:r,ang:ang};});
  // lines
  pts.forEach(function(p){var grad=x.createLinearGradient(cx,cy,p.x,p.y);
    grad.addColorStop(0,'rgba(198,144,73,.7)');grad.addColorStop(1,'rgba(198,144,73,.18)');
    x.strokeStyle=grad;x.lineWidth=1.1;x.beginPath();x.moveTo(cx,cy);x.lineTo(p.x,p.y);x.stroke();});
  // center star
  starDot(x,cx,cy,5,'#e6bd76');
  x.font='600 15px '+getFont();x.fillStyle='#ece3d0';x.textAlign='center';
  wrapLabel(x,e.name,cx,cy-16,120);
  // outer stars + labels
  var hit=[];
  pts.forEach(function(p){starDot(x,p.x,p.y,3.4,'#c69049');
    x.font='500 12px '+getFont();x.fillStyle='#c3bba9';
    var t=BYID[p.r.id];var nm=t?t.name:p.r.id;
    var below=p.y>cy;x.textAlign='center';
    x.fillText(clip(nm,14),p.x,p.y+(below?18:-12));
    hit.push({x:p.x,y:p.y,id:p.r.id});});
  c.onclick=function(ev){var rect=c.getBoundingClientRect();var mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
    for(var i=0;i<hit.length;i++){var d=Math.hypot(mx-hit[i].x,my-hit[i].y);if(d<28){ent(hit[i].id);return;}}};
}
function getFont(){return "'Palatino Linotype',Palatino,Georgia,serif";}
function clip(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
function wrapLabel(x,s,cx,cy,max){x.fillText(clip(s,16),cx,cy);}
function starDot(x,px,py,r,col){x.save();x.shadowColor=col;x.shadowBlur=10;
  x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=col;x.fill();
  // 4-point sparkle
  x.strokeStyle=col;x.lineWidth=1;x.beginPath();
  x.moveTo(px-r*2,py);x.lineTo(px+r*2,py);x.moveTo(px,py-r*2);x.lineTo(px,py+r*2);x.stroke();x.restore();}

var curPhase="before";

  var d=card.querySelector('.beatdeep'); if(!d)return;

    'Each beat opens for more — tap the names to meet the people inside it.</p></div>'+

    '<h2>Reference</h2><p>Everyone and everything, alphabetical. Search, or narrow by kind.</p></div>'+
    '<div class="controls"><div class="searchbox"><span style="color:var(--bronze)">⌕</span>'+
    '<input id="refq" placeholder="Search names, places, objects…" autocomplete="off"></div>'+
    '<div class="chips" id="refchips">'+
      filterChip('all','All','')+filterChip('character','People','')+filterChip('god','Gods','')+
      filterChip('place','Places','')+filterChip('thing','Objects','')+
    '</div></div><div id="reflist"></div>';
}
function wireReference(){
  var chips=document.getElementById('refchips'),q=document.getElementById('refq');
  chips.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.f===refFilter);
    b.onclick=function(){refFilter=b.dataset.f;chips.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b)});drawRef();};});
  q.value=refQuery;q.oninput=function(){refQuery=q.value.toLowerCase();drawRef();};
  drawRef();
}
function drawRef(){
  var list=ENTITIES.filter(function(e){
    if(refFilter!=='all'&&e.type!==refFilter)return false;
    if(refQuery&&(e.name+' '+(e.aka||'')+' '+e.essence).toLowerCase().indexOf(refQuery)<0)return false;
    return true;});
  list.sort(function(a,b){return a.name.localeCompare(b.name)});
  var g=document.getElementById('reflist');
  if(!list.length){g.innerHTML='<p class="empty">Nothing by that name.</p>';return;}
  var letters={};list.forEach(function(e){var L=e.name[0].toUpperCase();(letters[L]=letters[L]||[]).push(e);});
  g.innerHTML=Object.keys(letters).sort().map(function(L){
    return '<div class="sectlabel">'+L+'</div><div class="grid">'+letters[L].map(cardHTML).join('')+'</div>';
  }).join('');
}

/* ---------- SEARCH OVERLAY ---------- */
var selIdx=-1,ovMatches=[];
function openSearch(){document.getElementById('overlay').classList.add('on');
  var i=document.getElementById('ovinput');i.value='';selIdx=-1;ovResults('');setTimeout(function(){i.focus();},50);}
function closeSearch(){document.getElementById('overlay').classList.remove('on');}
function ovResults(q){
  q=q.toLowerCase().trim();
  var res=[];
  if(q){res=ENTITIES.filter(function(e){return (e.name+' '+(e.aka||'')).toLowerCase().indexOf(q)>=0;});
    EVENTS.forEach(function(ev){if(ev.title.toLowerCase().indexOf(q)>=0)res.push({_ev:ev});});}
  else{res=ENTITIES.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).slice(0,8);}
  ovMatches=res.slice(0,40);
  document.getElementById('ovresults').innerHTML=ovMatches.map(function(r,i){
    if(r._ev)return '<div class="ovitem" data-i="'+i+'"><b>'+esc(r._ev.title)+'</b><span>Story</span></div>';
    return '<div class="ovitem" data-i="'+i+'"><b>'+esc(r.name)+'</b><span>'+KIND[r.type]+'</span></div>';
  }).join('')||'<p class="empty">No matches.</p>';
  document.querySelectorAll('.ovitem').forEach(function(el){el.onclick=function(){pick(+el.dataset.i);};});
}
function pick(i){var r=ovMatches[i];if(!r)return;closeSearch();if(r._ev){curPhase=r._ev.phase;go('journey');}else ent(r.id);}
document.getElementById('ovinput').addEventListener('input',function(){selIdx=-1;ovResults(this.value);});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openSearch();}
  if(e.key==='Escape')closeSearch();
  if(document.getElementById('overlay').classList.contains('on')){
    if(e.key==='ArrowDown'){selIdx=Math.min(selIdx+1,ovMatches.length-1);hl();e.preventDefault();}
    if(e.key==='ArrowUp'){selIdx=Math.max(selIdx-1,0);hl();e.preventDefault();}
    if(e.key==='Enter'){pick(selIdx<0?0:selIdx);}
  }});
function hl(){document.querySelectorAll('.ovitem').forEach(function(el,i){el.classList.toggle('sel',i===selIdx);
  if(i===selIdx)el.scrollIntoView({block:'nearest'});});}

/* ---------- BOOT ---------- */
idx();route();
</script>
