 lore:"<p><span class=\"loretag\">World</span>Tiresias became the archetypal blind prophet of Greek myth, turning up across its greatest stories — he's the one who names Oedipus's guilt in Sophocles — always seeing the truth the sighted cannot. His paradox (blind, yet the clearest-seeing of all) proved endlessly resonant; T. S. Eliot made him the central consciousness of \"The Waste Land,\" the figure who has \"foresuffered all.\" Few minor characters have thrown so long a shadow.</p>",
 rels:[{id:"odysseus",label:"who seeks his prophecy"},{id:"underworld",label:"where he's consulted"},{id:"helios_cattle",label:"which he warns against"}]
},
{
 id:"nausicaa", name:"Nausicaa", resp:"naw-SIK-ay-uh", type:"character", epic:"odyssey",
 essence:"The young princess who finds a shipwrecked Odysseus washed up on her beach — and, with poise well beyond her years, gives him the first kindness of his homecoming.",
 sections:[
  {h:"Who she is", body:"Nausicaa is the young, unmarried daughter of King [[alcinous|Alcinous]] of the Phaeacians, on the island of [[scheria|Scheria]]. Sent by a dream to do the palace laundry at the river-mouth, she and her maids are playing ball on the shore when a naked, brine-crusted, half-dead [[odysseus|Odysseus]] staggers out of the bushes."},
  {h:"Grace under pressure", body:"Where her maids flee shrieking, Nausicaa holds her ground. She hears the ragged stranger out, has him bathed and clothed and fed, and shrewdly coaches him on how to win her parents' help — while carefully guarding her own reputation by making him follow at a distance so the town won't gossip. For a teenager facing down a naked castaway, she is astonishingly composed."},
  {h:"The road not taken", body:"There runs a delicate, unspoken thread of attraction: she half-imagines this impressive stranger as a husband, and her father even offers him her hand. But [[odysseus|Odysseus]] is bound for [[penelope|Penelope]] and home, and the two part with quiet dignity. It is one of the Odyssey's gentlest episodes — a glimpse of the ordinary, happy life the hero doesn't get to have."}
 ],
 mind:"<p>Nausicaa embodies <strong>civilization at its most gracious</strong> — the hospitality and decency the Odyssey holds up as the mark of a good society, in pointed contrast to the [[polyphemus|Cyclops]] who eats his guests. She is what humanity looks like when it behaves well.</p><p><span class=\"mindtag\">The life not lived</span>Her episode carries a soft melancholy. She represents a road [[odysseus|Odysseus]] could take — youth, a fresh start, a kingdom — and consciously doesn't. In choosing home and his aging wife over a younger, easier happiness, he turns something down, which is part of what makes the choice mean anything.</p>",
 lore:"<p><span class=\"loretag\">World</span>Readers have adored Nausicaa for centuries for her freshness and poise; the Victorian novelist Samuel Butler was so taken with her that he half-seriously argued the whole Odyssey must have been written by a woman, with Nausicaa as the author's self-portrait. Her name has since been borrowed widely — including for the heroine of Hayao Miyazaki's beloved film \"Nausicaä of the Valley of the Wind\" — wherever a story wants a young woman of courage and grace.</p>",
 rels:[{id:"odysseus",label:"the castaway she rescues"},{id:"scheria",label:"her homeland"},{id:"alcinous",label:"her father, the king"}]
},
{
 id:"eumaeus", name:"Eumaeus", resp:"yoo-MAY-us", type:"character", epic:"odyssey",
 essence:"Odysseus's loyal swineherd — a slave who keeps faith with a master gone twenty years, and shelters him, unknowing, on the very night he returns.",
 sections:[
  {h:"Who he is", body:"Eumaeus is the chief swineherd of [[ithaca|Ithaca]] — a slave, but a trusted and dignified one, who has faithfully tended [[odysseus|Odysseus]]'s pigs through all twenty years of his absence. When the disguised Odysseus finally returns, it is the humble hut of Eumaeus, not the palace, where he first finds shelter."},
  {h:"Loyalty tested", body:"Not knowing the ragged beggar is his long-lost master, Eumaeus takes him in, feeds him, and defends the absent [[odysseus|Odysseus]]'s honor — speaking of him with a love and grief that pass every test the hero can silently devise. In a household rotten with disloyal servants and grasping [[antinous|suitors]], Eumaeus's simple, unwitnessed faithfulness shines out."},
  {h:"The reckoning", body:"[[odysseus|Odysseus]] eventually reveals himself, and Eumaeus — overjoyed — becomes one of the small band who helps him retake his home, standing at his master's side in the final battle against the suitors. The loyal slave is rewarded; Homer even promises him a house and a wife of his own. Faithfulness, in the Odyssey, does not go unnoticed."}
 ],
 mind:"<p>Eumaeus embodies the Odyssey's deep interest in <strong>loyalty and its opposite</strong> — the poem is, among other things, a long audit of who kept faith with the absent king and who did not. That its very model of virtue is a slave, rather than a lord, is quietly striking.</p><p><span class=\"mindtag\">Nobility without rank</span>Homer treats Eumaeus with unusual tenderness, even giving him a backstory as a stolen prince — as if to insist that true nobility is a matter of character, not birth. In a rigidly hierarchical world, the poem lets its humblest faithful man stand among its most admirable.</p>",
 lore:"<p><span class=\"loretag\">World</span>Eumaeus holds a curious distinction: he is one of the very few characters Homer addresses <em>directly</em>, breaking the narration to say \"then you answered him, Eumaeus\" — a startling flash of intimacy, as though the poet feels a personal fondness for his loyal swineherd. Scholars still argue over why; the simplest guess may be the truest — that Homer, like his readers, simply loved him.</p>",
 rels:[{id:"odysseus",label:"the master he never gave up on"},{id:"telemachus",label:"whom he also protects"},{id:"melanthius",label:"the disloyal servant, his foil"},{id:"philoetius",label:"his fellow loyal herdsman"}]
},
{
 id:"antinous", name:"Antinous", resp:"an-TIN-oh-us", type:"character", epic:"odyssey",
 essence:"The ringleader of the suitors — arrogant, greedy, and cruel — who eats another man's house and is the first to die when its owner comes home.",
 sections:[
  {h:"Who he is", body:"Antinous is the most aggressive and unpleasant of the [[penelope|suitors]] — the mob of young noblemen camped in [[odysseus|Odysseus]]'s palace, devouring his wealth while pressing his wife to remarry and assuming her husband long dead. If the suitors have a leader, it is Antinous, and he sets their tone: entitled, greedy, and casually cruel."},
  {h:"The villain's record", body:"Homer stacks the case against him. Antinous plots to murder young [[telemachus|Telemachus]]; he hurls a footstool at the disguised [[odysseus|Odysseus]] as he begs in his own hall; he mocks and abuses the poor and the powerless. He is the poem's clearest violator of the sacred code of hospitality — which, in this world, is precisely what marks a man out for divine punishment."},
  {h:"First to fall", body:"When [[odysseus|Odysseus]] at last strings his great [[odysseus_bow|bow]] and turns on the suitors, Antinous is the very first to die — shot through the throat mid-drink, cup still in hand, wine and blood running together. Homer grants him no dignity in death, only the grim justice of a man cut down in the middle of the feast he had no right to be enjoying."}
 ],
 mind:"<p>Antinous embodies everything the Odyssey condemns: <strong>the abuse of hospitality and the arrogance of the entitled</strong>. In a culture where how you treat guests and the vulnerable is the measure of your worth, he fails every test, and does it on purpose.</p><p><span class=\"mindtag\">Deserving the arrow</span>His death is engineered to feel earned. Homer spends books making us watch him gorge on another man's substance and torment the helpless, so that when the arrow finds his throat the poem's moral universe clicks satisfyingly shut. He is the necessary villain of a story about justice, finally, coming home.</p>",
 lore:"<p><span class=\"loretag\">World</span>The suitors' slaughter has troubled some modern readers with its sheer scale and severity — dozens killed, disloyal servants hanged afterward — but within the poem's ethical world it reads as order violently restored. Antinous, as the worst offender and the first to die, anchors that whole logic: the Odyssey needs its homecoming to double as a reckoning, and he is the man on whom the reckoning most plainly, and most deservedly, lands.</p>",
 rels:[{id:"penelope",label:"whom he pressures to marry"},{id:"odysseus",label:"the king he wrongs, who kills him"},{id:"telemachus",label:"whom he bullies"}]
},
{
 id:"cassandra", name:"Cassandra", resp:"kuh-SAN-druh", type:"character", epic:"iliad",
 essence:"The Trojan princess cursed to see the future clearly and to be believed by absolutely no one — the loneliest form of knowledge there is.",
 sections:[
  {h:"Who she is", body:"Cassandra is a daughter of King [[priam|Priam]] and a princess of [[troy|Troy]], gifted with true prophecy — and cursed in the same stroke. [[apollo|Apollo]] granted her the power to see the future; when she then spurned him, he added a twist that could not be taken back: she would always be right, and never, ever believed."},
  {h:"The unheeded warnings", body:"Cassandra sees the whole catastrophe coming and can do nothing but watch it arrive. She warns against bringing [[helen|Helen]] into the city; she screams that the [[trojan_horse|wooden horse]] is packed with soldiers; she foretells Troy's fall in vivid detail. Every single time, her own family treats her as a madwoman. In her case, being right is indistinguishable from being ignored."},
  {h:"The end", body:"When Troy falls, Cassandra is dragged from a temple and carried off as a war-prize by [[agamemnon|Agamemnon]] — and she foresees that too, including her own murder waiting in [[mycenae|Mycenae]] at the hands of his wife. She walks toward it clear-eyed, because seeing the future has never once let her change it."}
 ],
 mind:"<p>Cassandra is one of literature's most haunting figures: the person who <strong>knows the truth and cannot make anyone hear it</strong>. Her curse is a nightmare distilled — perfect knowledge yoked to perfect powerlessness.</p><p><span class=\"mindtag\">The unbearable gift</span>She poses a question that still stings: what good is truth if no one will believe it? Her tragedy isn't ignorance but its opposite — she is the only one who understands, and it saves no one, least of all herself.</p>",
 lore:"<p><span class=\"loretag\">World</span>\"Cassandra\" has become the permanent name for the prophet of doom no one heeds — invoked constantly in politics, finance, and climate debate for anyone who correctly warns of a disaster and is dismissed until it's too late. Psychologists even speak of a \"Cassandra complex.\" Few figures from any myth have proved so uncomfortably reusable; every generation seems to supply its own.</p>",
 rels:[{id:"priam",label:"her father"},{id:"apollo",label:"who cursed her gift"},{id:"trojan_horse",label:"which she warns against"}]
},
{
 id:"aeneas", name:"Aeneas", resp:"uh-NEE-us", type:"character", epic:"iliad",
 essence:"A Trojan hero who survives the fall of his city — and, in Roman hands, sails west to become the legendary founding father of Rome itself.",
 sections:[
  {h:"Who he is", body:"Aeneas is a Trojan prince, son of the goddess [[aphrodite|Aphrodite]] and a cousin of [[hector|Hector]], and one of Troy's finest warriors after Hector himself. In the Iliad he is a solid second-rank hero — brave, pious, favored by the gods, and pointedly rescued from death more than once by divine intervention, as though someone is saving him for later."},
  {h:"Saved for a reason", body:"That impression is exactly right. When [[poseidon|Poseidon]] — normally no friend to Trojans — plucks Aeneas out of a losing fight with [[achilles|Achilles]], he explains why: Aeneas is fated to survive the war, because his bloodline must not perish. He and his descendants will rule the Trojans yet to come. Homer plants a seed the Romans would harvest a thousand years later."},
  {h:"The founder of Rome", body:"Centuries after Homer, the Roman poet Virgil made Aeneas the hero of his own epic, the \"Aeneid,\" following him from burning [[troy|Troy]] across the Mediterranean to Italy, where his descendants would found Rome. A minor Trojan warrior was promoted into the ancestor of an empire — Rome's way of grafting itself onto the towering prestige of Greek legend."}
 ],
 mind:"<p>Aeneas is a rare thing in the Iliad: a hero defined not by how he fights but by what he <strong>survives for</strong>. His importance is entirely about the future — the one Trojan whose story is only beginning as everyone else's ends.</p><p><span class=\"mindtag\">Duty over glory</span>Virgil later built him into the opposite of [[achilles|Achilles]]: not a hero of personal glory but of <em>pietas</em> — duty to family, gods, and destiny, carrying his old father out of the flames on his back. He became the model of the man who sacrifices himself for something larger, which is precisely the hero Rome wanted to claim as its own.</p>",
 lore:"<p><span class=\"loretag\">World</span>Aeneas is the great bridge between Greek and Roman myth. Through Virgil's \"Aeneid\" — Rome's national epic, deliberately modeled on Homer — he became the founding ancestor of the Roman people, and Julius Caesar's family claimed direct descent from him (and thus from [[aphrodite|Venus]] herself). It's a remarkable afterlife: a supporting player in the Iliad, promoted across the centuries into the mythic father of the ancient world's greatest empire.</p>",
 rels:[{id:"aphrodite",label:"his goddess mother"},{id:"hector",label:"his fellow Trojan champion"},{id:"diomedes",label:"who nearly kills him"}]
},
{
 id:"hecuba", name:"Hecuba", resp:"HEK-yoo-buh", type:"character", epic:"iliad",
 aka:"Queen of Troy",
 essence:"Troy's queen and its grieving mother — who lives to see her sons killed, her city burned, and her daughters carried off, and becomes the very emblem of a mother's suffering.",
 sections:[
  {h:"Who she is", body:"Hecuba is the queen of [[troy|Troy]], wife of old King [[priam|Priam]], and mother of a vast family that includes [[hector|Hector]], [[paris|Paris]], and [[cassandra|Cassandra]]. Across the war she watches nearly everything she loves destroyed, and her role in the Iliad is chiefly that of a mother in ever-deepening anguish."},
  {h:"The mother's grief", body:"Her most searing moments come around [[hector|Hector]]. She bares her breast to beg her son not to face [[achilles|Achilles]], and when he is killed anyway and his body dragged in the dust, her lament is one of the rawest cries of grief in the whole poem. Homer gives Troy's coming fall a human face, and it is very largely hers."},
  {h:"What comes after", body:"The war leaves her nothing. In the tradition beyond Homer, Hecuba survives the sack of the city only to be enslaved, to lose still more of her children, and — in the most harrowing versions — to be driven mad by grief. She becomes the ultimate image of the woman who outlives everyone she loves."}
 ],
 mind:"<p>Hecuba is the Iliad's fullest voice of <strong>the mother's side of war</strong> — the grief of those who bear the heroes and then bury them. Where the men chase glory, she counts only the cost, child by child by child.</p><p><span class=\"mindtag\">Grief without limit</span>Her suffering is so total it became, for the Greeks, almost a philosophical problem: how much can one person lose and still remain a person? Later tragedy pushed her to the very edge of that question — and Shakespeare's Hamlet, watching an actor weep for her, cannot understand why anyone would grieve so hard for a stranger, and cannot let the question go.</p>",
 lore:"<p><span class=\"loretag\">World</span>Hecuba became the archetype of maternal grief and the tragic queen, the subject of one of Euripides's most devastating plays. Her name echoes down through literature as shorthand for inconsolable sorrow — most famously in \"Hamlet,\" where the prince is shaken to see a mere player moved to real tears over her ancient suffering (\"What's Hecuba to him, or he to Hecuba?\"). Three thousand years on, she remains the measure of how much a mother can be made to bear.</p>",
 rels:[{id:"priam",label:"husband"},{id:"hector",label:"son she mourns"},{id:"paris",label:"son"},{id:"cassandra",label:"daughter"},{id:"andromache",label:"her grieving daughter-in-law"}]
},
{
 id:"sarpedon", name:"Sarpedon", resp:"sar-PEE-don", type:"character", epic:"iliad",
 essence:"A son of Zeus fighting for Troy — whose death forces even the king of the gods to accept that not his own child can be spared from fate.",
 sections:[
  {h:"Who he is", body:"Sarpedon is a prince of Lycia, an ally of [[troy|Troy]], and a son of [[zeus|Zeus]] himself by a mortal woman — which makes him one of the noblest and most sympathetic of the fighters on the Trojan side. Brave, eloquent, and clear-eyed about what he is doing, he ranks among the finest warriors in the poem."},
  {h:"Why heroes fight", body:"Sarpedon delivers one of the Iliad's most famous speeches, telling his comrade [[glaucus|Glaucus]] exactly why they lead from the very front: since death comes for everyone regardless, the only thing worth doing is to earn honor by boldly risking your life for it. It is the clearest statement of the entire heroic bargain in the poem — glory offered as the one answer to mortality."},
  {h:"The death Zeus allows", body:"When Sarpedon faces [[patroclus|Patroclus]], [[zeus|Zeus]] agonizes over whether to save his own son — and [[hera|Hera]] warns that if he breaks fate's rules for Sarpedon, every other god will do the same for their favorites and the order of the world will collapse. Zeus lets him die, weeping tears of blood, and sends Sleep and Death to carry the body gently home. Even the king of the gods bows to fate."}
 ],
 mind:"<p>Sarpedon exists largely to land one enormous point: <strong>not even the son of a god escapes death</strong>. If Zeus cannot save his own child, the message to every mortal is unmistakable — death is the single law that binds absolutely everything.</p><p><span class=\"mindtag\">The bargain, stated plainly</span>His speech to Glaucus is the philosophical heart of the Iliad's warrior code: we die anyway, so let us at least die for something that outlasts us. It's the clearest account in the poem of why any of these men fight at all — and Homer lets him prove it by dying exactly as he said one should.</p>",
 lore:"<p><span class=\"loretag\">World</span>The image of Sleep and Death — the twin brothers Hypnos and Thanatos — lifting Sarpedon's body from the field became one of the most beloved scenes in all of ancient art, painted on a famous vase by Euphronios that ranks among the masterpieces of Greek pottery. His farewell speech has been quoted for millennia as the purest expression of the heroic answer to death, echoing in war poetry straight through to the modern age.</p>",
 rels:[{id:"zeus",label:"his divine father"},{id:"patroclus",label:"who kills him"}]
},
{
 id:"laertes", name:"Laertes", resp:"lay-UR-teez", type:"character", epic:"odyssey",
 essence:"Odysseus's aged father — who withdraws from the world in grief for his lost son, and lives to fight at his side one last time.",
 sections:[
  {h:"Who he is", body:"Laertes is the old father of [[odysseus|Odysseus]] and former king of [[ithaca|Ithaca]], who long ago handed the rule to his son. By the time of the Odyssey he is a broken old man, so worn down by grief for his missing son that he has left the palace entirely to live rough on his farm, tending his orchard alone."},
  {h:"The last reunion", body:"One of the Odyssey's final scenes is the reunion of father and son. [[odysseus|Odysseus]], testing the old man one last time before revealing himself, finds him in the vineyard in filthy work clothes, half-wild with sorrow — and when he finally makes himself known, the shock of joy nearly overwhelms Laertes on the spot."},
  {h:"One last fight", body:"In the poem's closing moments, when the kin of the slain [[antinous|suitors]] come seeking revenge, old Laertes is roused to arms one final time — and, with a burst of divine strength, hurls the spear that fells their leader. Three generations — Laertes, his son [[odysseus|Odysseus]], and his grandson [[telemachus|Telemachus]] — stand together in the last fight. It's a fitting close to a poem so obsessed with family restored."}
 ],
 mind:"<p>Laertes embodies <strong>what absence does to those left behind</strong>. He is what [[odysseus|Odysseus]] himself might have become — a man hollowed out by loss — and his revival at his son's return completes the poem's deepest movement: not just a hero coming home, but a whole broken family made whole again.</p>",
 lore:"<p><span class=\"loretag\">World</span>The final gathering of grandfather, father, and son in arms is Homer's image of continuity restored — the household's line, nearly extinguished by twenty years of war and waiting, standing whole again across three generations. It is a quietly radical way to end an epic: not on a battlefield or a throne, but on a family farm, with an old man granted one last moment of strength.</p>",
 rels:[{id:"odysseus",label:"his lost son"},{id:"telemachus",label:"grandson"},{id:"penelope",label:"daughter-in-law"},{id:"penelope_shroud",label:"the shroud woven in his name"}]
},
{
 id:"eurycleia", name:"Eurycleia", resp:"yoo-rih-KLY-uh", type:"character", epic:"odyssey",
 essence:"Odysseus's old nurse — who raised him as a boy, knows him by a scar the instant he returns, and must be hushed before she gives the whole secret away.",
 sections:[
  {h:"Who she is", body:"Eurycleia is the aged household slave who nursed [[odysseus|Odysseus]] as an infant and, later, [[telemachus|Telemachus]] as well — a loyal fixture of the palace who has served the family her whole life. She is trusted, sharp, and utterly devoted to a master she believes long dead."},
  {h:"The scar", body:"Her great moment is one of the most famous recognition scenes in literature. Washing the disguised beggar's feet, Eurycleia's hands find an old boar-hunt scar on his leg — and she knows him instantly. Overjoyed and about to cry out, she is seized by [[odysseus|Odysseus]] and sworn to silence: the reunion must wait until his revenge is ready. Homer even halts the whole story to recount how he got that scar, in one of literature's most famous digressions."},
  {h:"Keeper of secrets", body:"Eurycleia keeps the secret, helps her master through the slaughter of the [[antinous|suitors]], and afterward identifies which of the household women had been disloyal. She is loyalty rewarded — the old servant who kept faith and lives to see the house set right."}
 ],
 mind:"<p>Eurycleia is the Odyssey's study of <strong>memory that lives in the body</strong>. She recognizes Odysseus not by his face or his words — both of which he has disguised — but by the touch of an old scar. Identity, the scene suggests, is written on the flesh, and a lifetime of intimacy can't be fooled.</p><p><span class=\"mindtag\">Loyalty across the divide</span>She is a slave who is more truly \"family\" than the highborn suitors, and Homer treats her devotion as genuine nobility — while never letting us forget she is also the instrument that condemns the other enslaved women to death.</p>",
 lore:"<p><span class=\"loretag\">World</span>The scene in which Eurycleia recognizes Odysseus by his scar became a landmark in the very study of literature: the critic Erich Auerbach opened his hugely influential book \"Mimesis\" by analyzing this exact passage, using Homer's fully-lit style — pausing even mid-suspense to explain the scar's whole history — to define one entire way of representing reality in Western writing. A servant washing an old man's feet, it turns out, sits near the foundation of literary criticism itself.</p>",
 rels:[{id:"odysseus",label:"whom she recognizes"},{id:"penelope",label:"her mistress"},{id:"telemachus",label:"whom she also raised"}]
},
{
 id:"astyanax", name:"Astyanax", resp:"uh-STY-uh-nax", type:"character", epic:"iliad",
 aka:"Scamandrius; his name means “lord of the city”",
 essence:"Hector's infant son — the baby on the walls of Troy, whose innocent future the whole poem mourns in advance, and whom the war does not spare.",
 sections:[
  {h:"Who he is", body:"Astyanax is the baby son of [[hector|Hector]] and [[andromache|Andromache]], still an infant during the events of the Iliad. His name means \"lord of the city\" — a hopeful name for a child everyone in the poem seems quietly to know will never live to be one."},
  {h:"The child on the wall", body:"He appears in the Iliad's most tender scene: as [[hector|Hector]] reaches to hold him before returning to battle, the baby shrieks in fright at the horsehair crest of his father's helmet, and both parents laugh through their dread. Hector prays that his son will one day be a greater man than himself. It is a prayer the audience already knows can never be answered."},
  {h:"What the war takes", body:"[[andromache|Andromache]] foresees his fate exactly — an orphan pushed from other men's tables — but the reality is worse still. When Troy falls, the victorious Greeks, fearing the son of [[hector|Hector]] might one day grow up to avenge the city, throw the child from the walls. The war's cruelty is total: it does not stop at the soldiers."}
 ],
 mind:"<p>Astyanax is the Iliad's most unbearable reminder that <strong>war spares no one</strong> — not the wives, not the mothers, and not the children. He never acts and never speaks; he exists in the poem purely as innocence, and as the future that all this killing destroys.</p><p><span class=\"mindtag\">The whole cost, in one child</span>Homer sets the tenderest scene in the epic — a father, a mother, a laughing baby — and lets us feel the full weight of what is coming precisely because he never has to show it. The gap between the loving family on the wall and the child's known fate is where the poem's deepest grief lives.</p>",
 lore:"<p><span class=\"loretag\">World</span>Astyanax became the enduring symbol of war's youngest victims, his death among the most affecting images in Greek tragedy — Euripides staged it with unsparing force in \"The Trojan Women,\" a play written as a protest against the atrocities of Athens's own wars. Across three thousand years he has stood for the same terrible truth: that the innocent are never exempt, and that a war fought by grown men is paid for, in the end, by children.</p>",
 rels:[{id:"hector",label:"father"},{id:"andromache",label:"mother"}]
},
{
 id:"glaucus", name:"Glaucus", resp:"GLAW-kus", type:"character", epic:"iliad",
 essence:"A Trojan-side hero best remembered for a battlefield moment of grace — trading armor with an enemy on discovering their grandfathers were friends.",
 sections:[
  {h:"Who he is", body:"Glaucus is a Lycian prince and, alongside his kinsman [[sarpedon|Sarpedon]], a leader of Troy's allies — a brave and capable fighter throughout the war."},
  {h:"The famous exchange", body:"His signature scene is a startling pause in the killing. Squared off against the Greek hero [[diomedes|Diomedes]], the two trade lineages before fighting — and discover that their grandfathers had once been guest-friends, bound by the sacred bond of hospitality. Rather than fight, they clasp hands, swap armor as a token of that old friendship, and part. It is a luminous reminder that even in total war, older human bonds could still hold."},
  {h:"The uneven trade", body:"Homer can't resist a wry footnote: Glaucus, swept up in the moment, trades his golden armor for [[diomedes|Diomedes]]'s bronze — exchanging the worth of a hundred oxen for the worth of nine. Even a beautiful gesture, the poet dryly observes, can be a slightly foolish bargain."}
 ],
 mind:"<p>Glaucus carries two of the Iliad's deepest ideas in a single minor character.</p><p><span class=\"mindtag\">Bonds beyond the battlefield</span>The armor exchange shows <em>xenia</em> — the sacred guest-friendship that could bind even enemies — briefly overriding the logic of war. For one scene, an old family tie matters more than which side you're on.</p><p><span class=\"mindtag\">Mortality</span>His \"leaves\" speech is the counterweight to every hero's dream of glory: if men fall and are replaced like leaves, the poem quietly asks, what exactly is all this dying <em>for</em>?</p>",
 lore:"<p><span class=\"loretag\">World</span>The Glaucus–Diomedes exchange became the classic ancient illustration of <em>xenia</em>, the sacred guest-friendship that bound households across generations and even across enemy lines — one of the deepest values in Homer's whole world. The lopsided swap of gold for bronze entered proverb too, a byword for a wildly unequal trade. The scene endures as the Iliad's gentlest: proof that the poem's imagination of war always kept room for the very ties that war was busy destroying.</p>",
 rels:[{id:"diomedes",label:"his friendly enemy"},{id:"sarpedon",label:"his fellow Lycian champion"}]
},

/* ===================== GODS ===================== */
{
 id:"zeus", name:"Zeus", resp:"ZOOSS", type:"god", epic:"both",
 aka:"king of the gods, the cloud-gatherer",
 essence:"King of the gods and lord of the sky — supreme, thunder-wielding, and married to a goddess who watches his every move with entirely justified suspicion.",
 sections:[
  {h:"Who he is", body:"Ruler of Olympus and god of the sky, storm, and thunderbolt, Zeus won his throne by overthrowing his own father and then drawing lots with his brothers [[poseidon|Poseidon]] and Hades to divide the cosmos — Zeus drew the sky. He is the ultimate authority, the guarantor of oaths, hospitality, and rough justice, and the one god the others actually obey (mostly). His weapon is the thunderbolt; his mood is the weather."},
  {h:"The reluctant referee", body:"In the Iliad Zeus mainly wants to stay above the gods' partisan brawling over [[troy|Troy]] — he's fond of both sides and chiefly wants his own larger plan carried out — but he spends the whole poem being lobbied, nagged, and outright deceived by [[hera|Hera]] and [[athena|Athena]]. At one low point Hera seduces him purely to distract him from the battlefield. Governing the gods, it turns out, is like chairing a meeting where everyone is armed, immortal, and related to you."},
  {h:"The philanderer", body:"Zeus's affairs are legendary and effectively endless — with goddesses, nymphs, and mortal women, producing a sprawling roster of half-divine children. Homer keeps most of this offstage, but it powers half of Greek myth, and it is the bottomless source of [[hera|Hera]]'s well-earned rage."}
 ],
 mind:"<p>Zeus is <strong>power itself</strong> — and Homer is quietly fascinated by the limits of even absolute power. He is supreme, yet bound by fate, worn down by his wife, and unable to save his own mortal son [[sarpedon|Sarpedon]] from death without tearing apart the very order he exists to uphold.</p><p><span class=\"mindtag\">Order over love</span>That moment — Zeus weeping tears of blood but letting his son die because the rules must hold — is the poem's sharpest study of authority. To rule everything is to lose the freedom to make exceptions, even for the people you love most.</p>",
 lore:"<p><span class=\"loretag\">World</span>Zeus was the chief god of the entire Greek world; his greatest sanctuary was Olympia, home both of the original Olympic Games, held in his honor, and of a colossal seated statue of him counted among the Seven Wonders of the ancient world. The Romans folded him into their Jupiter. His name descends from an ancient sky-father worshipped by the earliest Indo-European peoples — the same deep root that gives Latin its <em>deus</em> and, distantly, English its \"deity.\" He is, quite literally, one of the oldest gods we can still name.</p>",
 rels:[{id:"hera",label:"wife and rival"},{id:"athena",label:"favorite daughter"},{id:"sarpedon",label:"his doomed mortal son"},{id:"helen",label:"his daughter"},{id:"odysseus",label:"whose release he orders"}]
},
{
 id:"athena", name:"Athena", resp:"uh-THEE-nuh", type:"god", epic:"both",
 aka:"Pallas Athena, the grey-eyed",
 essence:"Goddess of wisdom, craft, and strategic war \u2014 clear-eyed, unsentimental, and utterly shameless about picking favorites among mortals who are clever enough to deserve her.",
 sections:[
  {h:"Who she is", body:"Athena was born the way everything in this family happens \u2014 alarmingly. [[zeus|Zeus]] swallowed her pregnant mother whole, developed a splitting headache, had his skull cracked open, and out sprang Athena, fully grown and fully armored, war-cry already on her lips. She is the goddess of wisdom and handicraft and of the <em>disciplined</em> side of war: the planning, the ambush, the cold tactical mind. This sets her against [[ares|Ares]], war's mindless bloodlust, whom she frankly despises and, at one point, drops with a well-aimed boulder. She patronizes the clever \u2014 weavers, shipwrights, and above all strategists \u2014 and has little patience for anyone else."},
  {h:"Her mortals", body:"Athena does not love humanity in the abstract. She loves competence, and she rewards it with a devotion that would embarrass a lesser god. [[odysseus|Odysseus]] is her darling because his mind works like hers; she stage-manages his entire homecoming \u2014 disguising him as a beggar, coaching his son [[telemachus|Telemachus]], appearing at his elbow at every turn \u2014 and in one candid moment admits, more or less fondly, that they are both champion liars and this is precisely why she can't stay away. At Troy she steers [[diomedes|Diomedes]] to wound gods in battle and personally engineers the death of [[hector|Hector]] through a cruel disguise. Divine impartiality is simply not among her interests."},
  {h:"The grudge", body:"Her hatred of Troy is old and personal. She was one of the three goddesses in the [[golden_apple|contest]] that lit the fuse of the whole war, and she lost \u2014 [[paris|Paris]] handed the prize to [[aphrodite|Aphrodite]] instead. Athena never forgets a slight, and she spends ten years methodically helping to grind Troy into ash, a reminder that Homer's gods carry their grievances exactly like people do, only with better siege equipment."}
 ],
 mind:"<p>Athena is the Greek dream of <strong>mind as power</strong> \u2014 intelligence, foresight, and self-command raised to the level of divinity. Where the other Olympians are jerked around by appetite and temper, she is the one who <em>plans</em>, and in a world that prizes cunning above almost everything, that makes her formidable.</p><p><span class=\"mindtag\">Wisdom isn't kindness</span>But Homer quietly complicates the ideal. Athena's wisdom comes with no obligation to be merciful or fair. She is coldly partisan; her brilliance serves her favorites, not justice, and she engineers deaths without a second thought. She is what pure strategic intelligence looks like when no warmth is attached to it \u2014 admirable, useful, and just a little frightening.</p>",
 lore:"<p><span class=\"loretag\">World</span>Athena was the patron goddess of Athens, and goddess and city share both a name and a founding story: she supposedly won the city in a contest with [[poseidon|Poseidon]] by giving it the olive tree \u2014 practical to the last. Her great temple was the Parthenon on the Acropolis, which once housed a colossal statue of her in gold and ivory. Her sacred bird was the owl, which is why an owl still means \"wisdom\" on everything from coins to cartoon logos today. In the Bronze-Age world Homer half-remembered, a single goddess covering warfare, weaving, and craftsmanship made perfect sense: a community survived on the loom, the forge, and the clever ambush in roughly equal measure, and Athena is the divinity of all three.</p>",
 rels:[{id:"odysseus",label:"her beloved mortal"},{id:"telemachus",label:"whom she mentors"},{id:"diomedes",label:"whom she empowers"},{id:"zeus",label:"her father"},{id:"paris",label:"who snubbed her"},{id:"aegis",label:"her fearsome shield"}]
},
{
 id:"apollo", name:"Apollo", resp:"uh-POL-oh", type:"god", epic:"both",
 essence:"God of light, music, plague, and prophecy — beautiful and deadly in equal measure, whose arrows open the Iliad by cutting down the Greek army.",
 sections:[
  {h:"Who he is", body:"One of the most powerful Olympians, Apollo governs a startling spread of things: sunlight, music, and healing on one hand; plague, sudden death, and prophecy on the other. Twin of [[artemis|Artemis]], he is the divine proof that beauty and destruction can pour from the same source. His instrument is the lyre; his weapon is the silver bow."},
  {h:"The plague that starts it all", body:"The Iliad opens with Apollo's arrows. When [[agamemnon|Agamemnon]] insults one of his priests by refusing to return the man's captured daughter [[chryseis|Chryseis]], Apollo answers the priest's prayer with nine days of plague raining down on the Greek camp — the spark that lights the quarrel between Agamemnon and [[achilles|Achilles]], and therefore the entire poem."},
  {h:"Troy's defender", body:"Apollo protects [[troy|Troy]] steadfastly throughout the war. He heals [[hector|Hector]], strikes the armor from [[patroclus|Patroclus]]'s back to leave him exposed to death, and guides the arrow of [[paris|Paris]] into [[achilles|Achilles]]'s one weak point. When a god has decided you die, courage and skill simply don't enter the calculation."}
 ],
 mind:"<p>Apollo is the god of <strong>the deadly side of order</strong> — reason, art, prophecy, the clean straight flight of an arrow — and a reminder that every one of those things can kill. He is not chaos. He is precision turned lethal.</p><p><span class=\"mindtag\">Beauty and terror</span>That plague and poetry answer to the same god is one of Greek religion's most unsettling ideas: the forces that illuminate the world are the same ones that can end you, and they run on their own cold logic, entirely indifferent to whether you deserve it.</p>",
 lore:"<p><span class=\"loretag\">World</span>Apollo's most famous shrine was the oracle at Delphi, reckoned the very center of the world, where a priestess delivered his notoriously riddling prophecies beneath the carved inscription \"Know thyself.\" His were the arts of the Muses, and later thinkers made him the emblem of clarity and restraint — the \"Apollonian\" ideal set against wild, ecstatic \"Dionysian\" abandon. Uniquely among the great gods, the Romans imported him without even changing his name. Few divinities have cast a longer shadow over how the West thinks about art itself.</p>",
 rels:[{id:"agamemnon",label:"whom he plagues"},{id:"patroclus",label:"whom he strikes down"},{id:"achilles",label:"whose death he guides"},{id:"cassandra",label:"whose gift he cursed"}]
},
{
 id:"poseidon", name:"Poseidon", resp:"po-SY-dun", type:"god", epic:"both",
 aka:"the earth-shaker, god of the sea",
 essence:"God of the sea and earthquakes — moody, immense, easily offended, and the relentless divine grudge that keeps Odysseus from home for ten long years.",
 sections:[
  {h:"Who he is", body:"Brother of [[zeus|Zeus]] and lord of the sea, Poseidon rules everything the Greeks feared most: the deep water they had to cross, the storms that drowned them, and the earthquakes that flattened their cities — his standing title is \"Earth-shaker.\" He is powerful, proud, and quick to take offense, which makes him the perfect god for an element that could turn on you without a moment's warning."},
  {h:"The old grudge", body:"He backs the Greeks at Troy and openly resents [[zeus|Zeus]]'s authority, at one point nearly defying his brother before grudgingly standing down. He has his own history with [[troy|Troy]]: he once built the city's very walls for a Trojan king who then cheated him of his wages, a slight he takes about as well as you would expect a sea-god to."},
  {h:"The hunter of Odysseus", body:"His great role comes in the Odyssey. When [[odysseus|Odysseus]] blinds his son, the Cyclops [[polyphemus|Polyphemus]], Poseidon turns the hero's voyage home into a decade of storms and shipwrecks. Fate won't let him kill Odysseus outright, so he does the next cruelest thing: ensures he arrives late, alone, broken, and stripped of every companion. Divine vengeance as slow, patient work."}
 ],
 mind:"<p>Poseidon is <strong>the sea made personal</strong> — vast, beautiful, indifferent, and capable of sudden annihilating rage. To a seafaring people, a god who could be insulted and would then hold the grudge for ten years was not a metaphor. It was a working theory of why the water kept killing them.</p><p><span class=\"mindtag\">A father's wound</span>His pursuit of Odysseus reads as pure spite until you notice what's underneath it: a father avenging a maimed, weeping son. Even the antagonist of the homecoming is grieving.</p>",
 lore:"<p><span class=\"loretag\">World</span>Poseidon was worshipped fervently by every Greek community that lived off the sea, which was nearly all of them; sailors poured offerings to him before a voyage the way a modern traveler checks the forecast. The horse was sacred to him — he was said to have created it — linking the surge of the surf to the stampede of hooves. The Romans called him Neptune. His temple still stands on the cliff at Cape Sounion above the Aegean: the last thing a sailor saw leaving Athens, and the first, if the god was willing, coming home.</p>",
 rels:[{id:"odysseus",label:"the man he hunts"},{id:"polyphemus",label:"his blinded son"},{id:"zeus",label:"his brother"}]
},
{
 id:"hera", name:"Hera", resp:"HAIR-uh", type:"god", epic:"iliad",
 aka:"queen of the gods",
 essence:"Queen of the gods and goddess of marriage — and the most implacable enemy Troy ever had, nursing a grudge with the patience only an immortal can afford.",
 sections:[
  {h:"Who she is", body:"Wife and sister of [[zeus|Zeus]] (the family tree is more of a family knot), Hera is queen of Olympus and goddess of marriage and women. Regal, proud, and formidable, she is no nurturing matron but a monarch in her own right — and she does not take being crossed with anything like grace."},
  {h:"The war on Troy", body:"Hera's hatred of [[troy|Troy]] is total and tireless. Snubbed by [[paris|Paris]] in the [[golden_apple|contest of the goddesses]], she throws the full weight of her cunning behind the Greeks, scheming and cajoling and — in one celebrated episode — seducing her own husband to get him off the battlefield long enough for the Greeks to rally. Her wrath is a strategic instrument."},
  {h:"The jealous wife", body:"Her other full-time occupation is punishing [[zeus|Zeus]]'s constant infidelities — usually by tormenting the women and children involved, since Zeus himself is beyond her reach. Homer treats the divine marriage as a barely-contained cold war between two enormous powers who can neither defeat each other nor, being gods, ever be rid of each other."}
 ],
 mind:"<p>Hera embodies <strong>legitimate power scorned</strong>. As the goddess of marriage she stands for order, fidelity, and the household — and yet she is married to the least faithful being in existence. Her rage is the specific fury of someone with real authority who is nonetheless perpetually disrespected in her own house.</p><p><span class=\"mindtag\">Wrath with a case</span>It's easy to file her under \"jealous wife,\" but Homer gives her a genuine grievance: she is right that Zeus wrongs her, right that Paris insulted her, and relentless in a world that offers even a queen very few ways to fight back.</p>",
 lore:"<p><span class=\"loretag\">World</span>Hera was among the oldest and most widely worshipped Greek deities — some of the very earliest Greek temples were hers, on Samos and at Argos. The Romans knew her as Juno, guardian of women and marriage, from whom we get the month of June (still a favorite for weddings) and, by way of her temple of \"Juno Moneta,\" of all things the word \"money.\" Her emblem was the peacock, its tail a hundred watching eyes — a fitting sigil for a goddess who never once missed what her husband was up to.</p>",
 rels:[{id:"zeus",label:"husband she manipulates"},{id:"athena",label:"fellow Troy-hater"},{id:"paris",label:"who scorned her"}]
},
{
 id:"aphrodite", name:"Aphrodite", resp:"af-ro-DY-tee", type:"god", epic:"iliad",
 aka:"goddess of love",
 essence:"Goddess of love and desire — irresistible, genuinely dangerous, and the one who set the whole war in motion by bribing a judge with another man's wife.",
 sections:[
  {h:"Who she is", body:"Goddess of love, beauty, and sexual desire — born, in one telling, from sea-foam — Aphrodite is a force neither god nor mortal can truly resist, which makes her far more dangerous than her charm suggests. Desire, in Homer, is never merely sweet. It is a power that topples cities."},
  {h:"The cause of everything", body:"The entire war traces back to her. Promised the title of fairest in the [[golden_apple|contest of the goddesses]], she bribed the judge [[paris|Paris]] with the most beautiful woman alive — [[helen|Helen]], who was unfortunately already married to a Greek king. Aphrodite delivered exactly as promised, and a thousand ships followed. She spends the war shielding Paris and Helen, with distinctly mixed results."},
  {h:"Out of her depth in war", body:"When Aphrodite ventures onto the battlefield herself — to rescue her son [[aeneas|Aeneas]] — the Greek hero [[diomedes|Diomedes]] actually wounds her hand, and she flees in tears to her mother. It's a small, near-comic scene with a sharp edge: the goddess of love is helpless exactly where the spears are, her power total everywhere except the one place these men have gathered to do their killing."}
 ],
 mind:"<p>Aphrodite is <strong>desire as a cosmic force</strong>, and Homer is unsentimental about how much damage it does. She is charming and often played lightly, yet she is the ultimate cause of the whole tragedy. Love, in the Iliad, is what starts the killing.</p><p><span class=\"mindtag\">Compulsion, not romance</span>Her power isn't tender or chosen. When [[helen|Helen]] once tries to defy her, Aphrodite simply threatens her into submission. She represents desire as something done <em>to</em> people, against their will — beautiful, overwhelming, and not remotely safe.</p>",
 lore:"<p><span class=\"loretag\">World</span>Aphrodite was worshipped across the Greek world, with especially ancient cult centers on Cyprus and Cythera, where she was each said to have first come ashore. The Romans knew her as Venus and made her the divine ancestress of their own nation through her son [[aeneas|Aeneas]] — which is how a goddess of love ended up at the root of Rome's founding myth. She went on to become the single most painted and sculpted figure in Western art; the armless \"Venus de Milo\" and Botticelli's \"Birth of Venus\" are both her. Desire, as it happens, has been very good for the arts.</p>",
 rels:[{id:"paris",label:"whom she rewarded"},{id:"helen",label:"whom she controls"},{id:"aeneas",label:"her mortal son"},{id:"diomedes",label:"who wounds her"},{id:"golden_apple",label:"her prize"}]
},
{
 id:"ares", name:"Ares", resp:"AIR-eez", type:"god", epic:"iliad",
 essence:"The god of war in its ugliest form — bloodlust, slaughter, and chaos — and, tellingly, a coward whom even his own family can't stand.",
 sections:[
  {h:"Who he is", body:"Ares is the god of war, but specifically its brutal, senseless side: the frenzy of killing, the noise and gore, violence for its own sake. Where [[athena|Athena]] embodies war as strategy and skill, Ares is war as butchery. The Greeks worshipped him without ever much liking him."},
  {h:"Despised on Olympus", body:"Homer makes Ares almost a figure of contempt. His own father [[zeus|Zeus]] tells him to his face that he is the most hateful of all the gods. And when [[athena|Athena]] guides the mortal [[diomedes|Diomedes]] to wound him in battle, the war-god runs bawling back to Olympus like a scolded child — unable, embarrassingly, to take the one thing he's the god of."},
  {h:"The lover", body:"His one softer storyline is his affair with [[aphrodite|Aphrodite]] — war and love, the two forces that most upend human lives, helplessly drawn to each other. In the famous tale her husband [[hephaestus|Hephaestus]] catches the pair in an unbreakable net and invites the other gods round to laugh."}
 ],
 mind:"<p>Ares embodies the Greek horror of <strong>war stripped of glory</strong> — not the heroism the poems celebrate but the raw, stupid slaughter underneath it. That the Greeks made their own war-god so unlovable says something: they knew exactly what war was, even as they sang about its heroes.</p><p><span class=\"mindtag\">Two faces of war</span>The contrast with [[athena|Athena]] is the entire point. Both are war deities, but she is discipline and cunning while he is bloodlust and panic — and Homer leaves no doubt which of the two he respects.</p>",
 lore:"<p><span class=\"loretag\">World</span>The Romans, a more frankly militaristic people, rehabilitated him entirely: as Mars he became a dignified, revered father-of-the-nation figure, second only to Jupiter, giving his name to the month of March (the old start of campaigning season) and to the red planet. The very god the Greeks sneered at, Rome placed near the center of its identity — a neat measure of how differently two cultures could feel about the same thing.</p>",
 rels:[{id:"athena",label:"his opposite in war"},{id:"aphrodite",label:"his lover"},{id:"diomedes",label:"who wounds him"}]
},
{
 id:"hephaestus", name:"Hephaestus", resp:"heh-FESS-tus", type:"god", epic:"iliad",
 essence:"The lame smith-god of the forge — mocked for his limp, married to the goddess of beauty, and the maker of every wondrous thing the gods possess.",
 sections:[
  {h:"Who he is", body:"Hephaestus is the divine blacksmith, god of fire and craft, who forges the gods' palaces, weapons, and marvels. He is also the only Olympian with a disability — lame in both legs after a fall (or a throw) from Olympus — and the butt of the other gods' easy laughter for it."},
  {h:"The craftsman", body:"What he lacks in grace he more than repays in genius. He builds automata — golden serving-maidens who can think and speak, tripods that move on their own — and at [[thetis|Thetis]]'s request forges a new suit of armor for [[achilles|Achilles]], including [[achilles_armor|a shield]] so densely worked with scenes of the whole human world that Homer spends a hundred lines simply describing it. It is the poem's great emblem of art itself."},
  {h:"The mismatched marriage", body:"He is married, improbably, to [[aphrodite|Aphrodite]] — the least handsome god wed to the most beautiful goddess — who repays him with an affair with [[ares|Ares]]. Hephaestus takes his revenge through cleverness rather than force, snaring the lovers in an inescapable net of his own making. The craftsman wins the way craftsmen do: by out-building everyone."}
 ],
 mind:"<p>Hephaestus is the Greek image of <strong>the maker</strong> — the one who creates rather than destroys, earning his place through skill in a pantheon otherwise obsessed with power and beauty. In a world of warriors and lovers, he is the one who actually builds the things.</p><p><span class=\"mindtag\">Worth beneath the surface</span>His story quietly rebukes a shallow world: the mocked, limping outsider is the one everyone depends on, and his revenge on the beautiful people who laugh at him is simply to be better at what he does than anyone alive.</p>",
 lore:"<p><span class=\"loretag\">World</span>Hephaestus was especially honored in craft-heavy Athens, whose superbly preserved temple to him still overlooks the ancient marketplace. The Romans knew him as Vulcan — from whom we get \"volcano,\" the fire-mountains imagined as his forges, and \"vulcanize.\" His Shield of Achilles has fascinated readers for millennia as the earliest and greatest example of <em>ekphrasis</em>: a work of art described so vividly in words that the description becomes a work of art in its own right.</p>",
 rels:[{id:"thetis",label:"who asks his help"},{id:"achilles",label:"for whom he forges armor"},{id:"achilles_armor",label:"his masterwork"}]
},
{
 id:"hermes", name:"Hermes", resp:"HUR-meez", type:"god", epic:"both",
 essence:"The quick-witted messenger of the gods — trickster, traveler, guide of the dead, and patron of everyone who lives by their wits, thieves cheerfully included.",
 sections:[
  {h:"Who he is", body:"Hermes is the messenger god — the fast one, in his winged sandals, who carries the will of [[zeus|Zeus]] between Olympus and the mortal world. He's also god of travelers, merchants, boundaries, cunning, luck, and (fittingly) thieves and liars. When a scheme needs a clever go-between, Hermes is the god you want."},
  {h:"The helper", body:"In both epics he's the gods' fixer. He guides [[priam|Priam]] safely through the Greek camp to [[achilles|Achilles]]'s tent; he carries [[zeus|Zeus]]'s order freeing [[odysseus|Odysseus]] to [[calypso|Calypso]]; and crucially he slips Odysseus the herb [[moly|moly]] to break [[circe|Circe]]'s spell. He is the divine assistance that arrives at precisely the right moment."},
  {h:"Guide of souls", body:"One of his stranger, older duties is escorting the dead down to the [[underworld|land of the dead]] — the one Olympian who moves freely between the living and the dead alike. The god of boundaries is the natural choice to conduct souls across the last boundary of all."}
 ],
 mind:"<p>Hermes embodies <strong>cleverness as its own kind of power</strong> — the intelligence that gets around obstacles rather than smashing through them. He is the divine cousin of [[odysseus|Odysseus]]'s own cunning, which is exactly why he keeps turning up to help him.</p><p><span class=\"mindtag\">The god of the in-between</span>His domains all share a theme: crossings, thresholds, exchanges. Messages, trade, travel, translation, the passage from life to death — Hermes governs every place where one world touches another, which makes him the most mobile and adaptable of all the gods.</p>",
 lore:"<p><span class=\"loretag\">World</span>The Romans knew him as Mercury — the swift planet, the liquid metal, the \"mercurial\" temperament. His serpent-twined staff, the caduceus, is still (by a common mix-up) used as a symbol of medicine. As patron of interpreters and messages, his Greek name gave us \"hermeneutics,\" the very art of interpretation — a fitting legacy for the god who carried meaning between worlds.</p>",
 rels:[{id:"odysseus",label:"whom he aids"},{id:"calypso",label:"whom he orders to free Odysseus"},{id:"moly",label:"the herb he provides"}]
},
{
 id:"artemis", name:"Artemis", resp:"AR-tuh-miss", type:"god", epic:"iliad",
 aka:"goddess of the hunt and the moon",
 essence:"The wild virgin huntress — goddess of the untamed forest, the hunt, and childbirth, as quick to protect the innocent as to strike them down.",
 sections:[
  {h:"Who she is", body:"Twin sister of [[apollo|Apollo]], Artemis is goddess of the hunt, of wild animals and the wilderness, and — more surprisingly — of childbirth. She roams the mountains with her band of nymphs, fiercely virgin and fiercely independent: a goddess of everything that lies outside the tamed, walled world of men."},
  {h:"In the war", body:"Like her brother she sides with [[troy|Troy]], but she plays a smaller part, and gets little respect for it — in one scene [[hera|Hera]] boxes her ears and sends her weeping to [[zeus|Zeus]] like a scolded girl. Her arrows, paired with [[apollo|Apollo]]'s, were also how the Greeks explained the sudden natural death of women, as his explained men's."},
  {h:"The demand at Aulis", body:"Her darkest touch on the story comes before the war even begins. Offended by [[agamemnon|Agamemnon]], she stills the winds and traps the Greek fleet, demanding the sacrifice of his daughter [[iphigenia|Iphigenia]] as the price of sailing. The goddess who guards the young also, terribly, requires one — the contradiction Homer's gods never bother to resolve."}
 ],
 mind:"<p>Artemis embodies <strong>the wild that will not be tamed</strong> — nature as something beautiful, free, and wholly outside human control or morality. She protects the young yet demands human blood; she is a virgin goddess of childbirth. Homer's gods refuse to collapse into tidy symbols.</p><p><span class=\"mindtag\">Freedom and its price</span>She is the great mythic figure of female autonomy — answering to no husband, belonging to no city — and the myths around her are correspondingly uneasy about a woman who owes nothing to anyone. To cross her is fatal, which may be the only way such independence could be safely imagined.</p>",
 lore:"<p><span class=\"loretag\">World</span>Artemis's temple at Ephesus was another of the Seven Wonders of the ancient world, and her cult one of the most widespread in antiquity. The Romans knew her as Diana. Her name still marks the untamed and the chaste in equal measure, and she remains a favorite emblem of independence and the natural world — the moon, the forest, the hunt — wherever those are invoked.</p>",
 rels:[{id:"apollo",label:"her twin brother"},{id:"agamemnon",label:"whose daughter she demanded"},{id:"zeus",label:"her father"}]
},
{
 id:"thetis", name:"Thetis", resp:"THEE-tiss", type:"god", epic:"iliad",
 aka:"the silver-footed sea-goddess",
 essence:"A sea-goddess and Achilles's mother — who knows her beloved son is fated to die young, and spends the Iliad trying to soften a doom she cannot lift.",
 sections:[
  {h:"Who she is", body:"Thetis is a sea-nymph, a minor but ancient goddess, and the mother of [[achilles|Achilles]]. Married off to a mortal king against her will, she bears the greatest warrior of the age — and a grief she can never escape, because she alone knows exactly how short his life is going to be."},
  {h:"The mother's intercession", body:"When [[agamemnon|Agamemnon]] dishonors [[achilles|Achilles]], Thetis goes straight to [[zeus|Zeus]] and wins his promise to turn the war against the Greeks until her son is honored — setting the whole plot in motion. Later she has [[hephaestus|Hephaestus]] forge him [[achilles_armor|new armor]]. She works the divine channels tirelessly on his behalf: a mother lobbying the powerful for a child she cannot save."},
  {h:"Grief foreknown", body:"What makes Thetis so piercing is that she mourns [[achilles|Achilles]] while he is still alive. Every gift she wins him only speeds him toward the death she foresees — finer armor means more battle, more glory, a sooner end. She loves him the only way left to her: by making his brief life magnificent."}
 ],
 mind:"<p>Thetis is the Iliad's portrait of <strong>a parent's helplessness before fate</strong>. She is a goddess, and it isn't enough — she can win her son armor and honor and even the favor of Zeus, but not one extra day of life. Divine power runs headlong into the same wall that mortal love does.</p><p><span class=\"mindtag\">Loving the doomed</span>She grieves in advance, which is its own particular agony. Every act of her devotion is shadowed by the knowledge of how it ends, and the poem finds in her something every parent knows: the terror of loving someone you are powerless to protect.</p>",
 lore:"<p><span class=\"loretag\">World</span>Thetis was important enough that ancient sources hint she may once have been a far greater goddess in older, lost traditions — a prophecy that her son would grow mightier than his father is the very reason the gods hurriedly married her off to a mortal. In Homer she is diminished to a grieving mother, but the fragments suggest a deep and powerful figure whose fuller myth has mostly washed away with time.</p>",
 rels:[{id:"achilles",label:"her doomed son"},{id:"zeus",label:"whom she petitions"},{id:"hephaestus",label:"who forges armor at her request"}]
},

/* ===================== PLACES ===================== */
{
 id:"troy", name:"Troy", resp:"", type:"place", epic:"iliad",
 aka:"Ilium (which gives the Iliad its name)",
 essence:"The great walled city under a ten-year siege \u2014 half history, half legend, and the reason a thousand ships crossed the sea over one runaway marriage.",
 sections:[
  {h:"What it is", body:"Troy \u2014 also called Ilios, which is where <em>Iliad</em> comes from \u2014 is a rich, high-walled city on the coast of what is now northwestern Turkey, standing guard over the narrow straits between the Aegean and the Black Sea. Crucially, in Homer it is a real, breathing city, not a cardboard enemy: it has temples and markets, a proud royal family under old King [[priam|Priam]], husbands and wives and children with everything to lose. Its walls, said to have been raised by gods, are its great defense \u2014 and, in the end, no defense at all against a wooden horse and ten years of accumulated grievance."},
  {h:"The war", body:"The whole catastrophe begins with something almost embarrassingly small. [[paris|Paris]], a prince of Troy, runs off with [[helen|Helen]], the wife of a Greek king \u2014 and a coalition of Greek kingdoms crosses the sea to get her back. Or so they say; [[agamemnon|Agamemnon]], who leads them, is at least as interested in Troy's wealth and its grip on the straits. For ten years the two armies grind against each other on the plain below the walls. The Iliad itself covers only a few weeks near the very end, but it makes you feel the full, sickening length of the whole thing."},
  {h:"The fall", body:"The city that cannot be stormed is finally taken by a trick \u2014 [[trojan_horse|the horse]] \u2014 and then destroyed utterly: the men killed, the women [[hecuba|led away into slavery]], not even the [[astyanax|smallest child]] spared. What is remarkable is where Homer's sympathy lies. Some of the most human and moving figures in the poem are the Trojans who lose everything, and the poem never once lets you simply cheer. It is a war epic with no clean winners \u2014 only survivors and the dead."}
 ],
 lore:"<p><span class=\"loretag\">World</span>For most of history, Troy was assumed to be pure myth \u2014 until, in the 1870s, a wealthy and spectacularly reckless amateur named Heinrich Schliemann dug into a mound called Hisarlik in Turkey and found a real city. In fact he found many cities, stacked in layers across thousands of years. In his impatience to reach treasure he blasted straight down <em>through</em> the layer now thought to be Homer's Troy, an act of archaeological vandalism that scholars have been quietly mourning ever since. What survives shows a genuine Bronze-Age stronghold that was fortified, burned, and rebuilt more than once around the traditional date of the war, roughly 1200 BCE. Whether \"the\" Trojan War happened, no one can say; that wars over that priceless strait happened is beyond doubt. Homer, composing several centuries later, was reaching back through a long fog of oral memory toward a real, vanished age \u2014 which is part of why the Iliad reads less like a battle report than an elegy for an entire lost world.</p>",
 rels:[{id:"priam",label:"its king"},{id:"hector",label:"its champion"},{id:"greekcamp",label:"the besiegers opposite it"},{id:"trojan_horse",label:"what destroys it"}]
},
{
 id:"ithaca", name:"Ithaca", resp:"ITH-uh-kuh", type:"place", epic:"odyssey",
 essence:"Odysseus's rugged little island kingdom — rocky, remote, and worth more to him than a goddess's paradise or the gift of immortality itself.",
 sections:[
  {h:"The home he's fighting for", body:"Ithaca is [[odysseus|Odysseus]]'s island kingdom, a small, rocky place off the west coast of Greece — no rich plain, no golden citadel, just steep hills good for goats. And it is the single fixed point of the entire Odyssey: the home Odysseus spends twenty years, and refuses immortality itself, to reach."},
  {h:"A kingdom in decline", body:"In his absence Ithaca has slid into disorder — the [[antinous|suitors]] devouring the palace, [[penelope|Penelope]] besieged, [[telemachus|Telemachus]] powerless, [[laertes|Laertes]] gone to grieve on a farm. The state of the island mirrors the state of the household: without its king, everything is quietly falling apart. His homecoming is as much a restoration of order as a family reunion."}
 ],
 mind:"<p>Ithaca is the Odyssey's answer to the question <strong>what is worth going home to?</strong> — and the answer is pointedly humble. Not wealth or glory or a goddess's bed, but a poor, rocky island, a wife, an old dog, an aged father. The poem insists that home is precious not because it is grand but because it is <em>yours</em>.</p>",
 lore:"<p><span class=\"loretag\">World</span>A real Ithaca exists in the Ionian Sea, and it has drawn treasure-hunters and scholars for centuries trying to match Homer's geography to the map — with maddening results, since his descriptions don't quite fit the modern island, fueling rival theories that the \"real\" Ithaca lay somewhere else entirely. Homer turned an unremarkable rock into the most famous home in literature: \"Ithaca\" now means any long-sought destination, immortalized in Cavafy's beloved poem urging travelers to hope the road there is long.</p>",
 rels:[{id:"odysseus",label:"its king"},{id:"penelope",label:"its queen, waiting"},{id:"olive_bed",label:"the bed rooted in its soil"}]
},
{
 id:"olympus", name:"Mount Olympus", resp:"oh-LIM-pus", type:"place", epic:"both",
 essence:"The cloud-wrapped mountain home of the gods — a serene, deathless world of feasting and squabbling, hovering high above the human carnage below.",
 sections:[
  {h:"The seat of the gods", body:"Mount Olympus is the dwelling of [[zeus|Zeus]] and the great gods, imagined as a peak so high it rises above the weather into perpetual clear sky. Up there the gods feast on nectar and ambrosia, listen to [[apollo|Apollo]]'s lyre, and live in golden, untroubled ease — the serene opposite of the mortal world below."},
  {h:"A view of the war", body:"Much of the Iliad's drama plays out on Olympus, where the gods watch the fighting like spectators at a game, taking sides, meddling, and quarreling bitterly over their mortal favorites. The contrast is deliberate and brutal: for the gods it's entertainment and family drama; for the men on the plain it's death. Olympus is the balcony from which immortals watch mortals die."}
 ],
 mind:"<p>Olympus embodies one of Homer's most unsettling ideas: <strong>the gods are not better than us, only deathless</strong>. Freed from mortality, they are freed also from stakes — petty, partisan, and casually cruel precisely because nothing ever truly costs them anything. Their perfect, painless world throws the fragile weight of a human life into sharp relief.</p>",
 lore:"<p><span class=\"loretag\">World</span>Mount Olympus is a real mountain — at nearly 3,000 meters the highest in Greece, its summit genuinely lost in cloud for much of the year, which is surely why the ancients placed the gods up there. Its name became shorthand for the heights of any field (\"the Olympians\" of a profession); and although the ancient Games were actually held elsewhere, at Olympia sacred to Zeus, the mountain still lends its name to the modern Olympics and to anything lofty, remote, and above the fray.</p>",
 rels:[{id:"zeus",label:"its ruler"},{id:"hera",label:"its queen"},{id:"athena",label:"who dwells there"}]
},
{
 id:"sparta", name:"Sparta", resp:"SPAR-tuh", type:"place", epic:"both",
 essence:"Menelaus and Helen's wealthy kingdom — the home the stolen queen was taken from, and the prosperous court she returns to once it's all over.",
 sections:[
  {h:"Who lives there", body:"Sparta is the rich kingdom of [[menelaus|Menelaus]] and [[helen|Helen]], set in a fertile valley in the southern Greek Peloponnese. It was from here that [[paris|Paris]] carried Helen off to [[troy|Troy]] — making Sparta the wound the whole war exists to avenge."},
  {h:"The court restored", body:"In the Odyssey, [[telemachus|Telemachus]] travels to Sparta seeking news of his father and finds [[menelaus|Menelaus]] and [[helen|Helen]] reconciled and living in glittering wealth, hosting guests with lavish grace. Their restored, prosperous home is a picture of a homecoming that actually worked out — a hopeful sign held up to the anxious young man still waiting for his own father to appear."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The Sparta of Homer's legend is not yet the grim military city-state of later \"Spartan\" fame — no austere barracks or laconic one-word answers here, just a wealthy Bronze Age court. That harsher Sparta came centuries afterward, though the historical Spartans proudly claimed [[menelaus|Menelaus]] and [[helen|Helen]] as their own, keeping a shrine where the runaway queen was honored almost as a goddess. Two very different Spartas, sharing a single famous name.</p>",
 rels:[{id:"menelaus",label:"its king"},{id:"helen",label:"its queen"},{id:"telemachus",label:"who visits seeking news"}]
},
{
 id:"mycenae", name:"Mycenae", resp:"my-SEE-nee", type:"place", epic:"iliad",
 aka:"“rich in gold”",
 essence:"Agamemnon's mighty citadel, “rich in gold” — the seat of Greek power in the war, and later the very place archaeology dug the legend out of the ground.",
 sections:[
  {h:"The seat of Greek power", body:"Mycenae is the fortress-city of [[agamemnon|Agamemnon]], the most powerful of the Greek kingdoms and the base from which he commands the whole coalition against [[troy|Troy]]. Homer calls it \"rich in gold\" — a citadel of massive walls and vast wealth, the natural home of the war's overbearing high king."},
  {h:"A cursed house", body:"Mycenae is also the seat of the doomed House of Atreus, and the stage for the saga's darkest homecoming: it is here that [[agamemnon|Agamemnon]] returns in triumph only to be murdered by [[clytemnestra|Clytemnestra]], setting off a chain of family bloodshed that echoes all through Greek tragedy. Its gold sits squarely atop a curse."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Mycenae is thrillingly, verifiably real. In the 1870s Heinrich Schliemann excavated the site and unearthed spectacular Bronze Age gold — including a funeral mask he famously (and quite wrongly) declared to be Agamemnon's — proving that a rich, powerful civilization had genuinely flourished there long before classical Greece. That whole lost world is now called \"Mycenaean\" after the city, and its colossal \"Cyclopean\" walls — so vast that later Greeks assumed only [[polyphemus|Cyclopes]] could have raised them — still stand today.</p>",
 rels:[{id:"agamemnon",label:"its king"},{id:"odysseus",label:"whose homecoming it shadows"}]
},
{
 id:"greekcamp", name:"The Greek Camp", resp:"", type:"place", epic:"iliad",
 essence:"The sprawling Greek camp on the shore below Troy — a ramshackle city of ships and tents that is the real stage of the Iliad.",
 sections:[
  {h:"The stage of the Iliad", body:"Almost the entire Iliad unfolds not inside [[troy|Troy]] but here, in the vast Greek encampment drawn up on the beach between their black ships and the city walls. After ten years it has become a semi-permanent town of tents, huts, and hauled-up ships — the crowded, restless home of a whole army far from its own homes."},
  {h:"Where the quarrel burns", body:"The camp is where the Iliad's human drama lives: the assembly where [[agamemnon|Agamemnon]] and [[achilles|Achilles]] tear into each other, the tent where Achilles sulks, the desperate defense when [[hector|Hector]] breaks through to burn the ships. When the fighting turns against the Greeks, the camp itself — their ships, their only way home — becomes the thing they are frantically defending."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The camp is a vivid picture of the ancient reality of a besieging army: not a quick clash but a decade-long occupation, an improvised society with its own assemblies, quarrels, funerals, and athletic games. The beached ships matter enormously — burn them, and the army is stranded forever. That is why [[hector|Hector]]'s push to set them alight is the Iliad's point of maximum danger: it threatens not merely a defeat, but the loss of any way home at all.</p>",
 rels:[{id:"achilles",label:"who sulks in it"},{id:"agamemnon",label:"who commands it"},{id:"hector",label:"who nearly burns it"},{id:"troy",label:"the city it besieges"}]
},
{
 id:"scheria", name:"Scheria", resp:"SKER-ee-uh", type:"place", epic:"odyssey",
 aka:"land of the Phaeacians",
 essence:"The idyllic island of the Phaeacians — Odysseus's last magical stop, and the gentle bridge between his wild adventures and the real world of home.",
 sections:[
  {h:"The last stop", body:"Scheria is the home of the Phaeacians, a peaceful, prosperous, seafaring people ruled by kind King [[alcinous|Alcinous]]. Washed up here after his final shipwreck, [[odysseus|Odysseus]] finds a paradise of gardens, feasts, athletic games, and famously magical ships — vessels that need no steersman and know their own way across the sea."},
  {h:"The great frame", body:"Scheria is where [[odysseus|Odysseus]] tells his whole incredible story — the Cyclops, [[circe|Circe]], the land of the dead — to [[alcinous|Alcinous]]'s court. It sits exactly between the fantastical world of his wanderings and the real, dangerous world of [[ithaca|Ithaca]] still ahead: the airlock between fairy-tale and homecoming. The Phaeacians' final gift is the ship that carries him home at last."}
 ],
 lore:"<p><span class=\"loretag\">World</span>The Phaeacians are almost too civilized to be quite of this world — half real people, half fairy-tale, living at the very edge of the map. Their kindness to strangers is the poem's gold standard of hospitality, and it costs them: for ferrying Odysseus home, [[poseidon|Poseidon]], still nursing his grudge, turns their returning ship to stone within sight of their own harbor. Even the most generous of hosts, the Odyssey warns, can be punished for helping the wrong wanderer.</p>",
 rels:[{id:"nausicaa",label:"its princess"},{id:"odysseus",label:"its famous guest"},{id:"alcinous",label:"its king"},{id:"demodocus",label:"its bard"}]
},
{
 id:"ogygia", name:"Ogygia", resp:"oh-JIJ-ee-uh", type:"place", epic:"odyssey",
 essence:"Calypso's remote island paradise — the beautiful prison at the edge of the world where Odysseus spends seven years longing for home.",
 sections:[
  {h:"The paradise-prison", body:"Ogygia is the secluded island of the goddess [[calypso|Calypso]], set at the very navel of the sea, about as far from anywhere as the Odyssey's geography reaches. It is genuinely idyllic — soft meadows, sweet springs, a cave wreathed in vines — and it is where [[odysseus|Odysseus]] is held for seven years, loved and comfortable and utterly, desperately trapped."},
  {h:"The gilded cage", body:"Nothing on Ogygia is unpleasant except the one thing that matters: [[odysseus|Odysseus]] cannot leave, and cannot go home. He spends his days on the shore weeping at the sea. The island is the Odyssey's sharpest image of the gap between comfort and happiness — paradise itself is a prison when it isn't the place you belong."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Ogygia's sheer remoteness made it a favorite target for ancient and modern geographers trying to pin Homer's fantasy onto the real Mediterranean — Malta, Gozo, and various Atlantic islands have all been proposed, all unprovably. The name came to stand for anything impossibly ancient and far off (\"Ogygian\" means primeval), a fitting legacy for an island at the lonely edge of the world.</p>",
 rels:[{id:"calypso",label:"its goddess"},{id:"odysseus",label:"its reluctant captive"}]
},
{
 id:"aeaea", name:"Aeaea", resp:"ee-EE-uh", type:"place", epic:"odyssey",
 essence:"Circe's enchanted island — where men are turned to swine, and a year of ease nearly ends Odysseus's journey for good.",
 sections:[
  {h:"Circe's island", body:"Aeaea is the wooded island home of the witch-goddess [[circe|Circe]], where [[odysseus|Odysseus]]'s crew first fall under her spell and are turned into pigs. Once Odysseus wins her over, it becomes an unexpected haven — the crew linger a full year in feasting and comfort before they can bring themselves to leave."},
  {h:"The gateway to the dead", body:"Aeaea is also the launch point for the Odyssey's eeriest voyage: it's from here, on [[circe|Circe]]'s instructions, that [[odysseus|Odysseus]] sails to the very edge of the world to consult the dead in the [[underworld|land of the dead]] — and here he returns afterward to bury [[elpenor|Elpenor]] and get Circe's final directions past the [[siren_song|Sirens]] and the monsters beyond."}
 ],
 lore:"<p><span class=\"loretag\">World</span>Later Romans confidently identified Aeaea with a real headland on the Italian coast, Monte Circeo south of Rome, which still bears the witch's name — an early case of a whole culture pinning its mythical map onto its own backyard. The island's true role in the poem is quieter than its magic: it is the threshold between the world of the living and the world of the dead, the last solid ground before Odysseus goes where no living man is meant to go.</p>",
 rels:[{id:"circe",label:"its sorceress"},{id:"odysseus",label:"its guest, then master of it"},{id:"underworld",label:"which it borders"}]
},
{
 id:"underworld", name:"The Underworld", resp:"", type:"place", epic:"odyssey",
 aka:"Hades, the land of the dead",
 essence:"The gray land of the dead — where Odysseus goes to consult a ghost, and hears the most desolate truth in either poem.",
 sections:[
  {h:"The land of the dead", body:"The Underworld, the realm of Hades, is where the spirits of the dead drift as pale, gibbering shades — not tormented exactly, but emptied, mere echoes of the people they once were. [[odysseus|Odysseus]] journeys to its edge to consult the prophet [[tiresias|Tiresias]], summoning the ghosts with offerings of blood, in the strangest and most haunting episode of the whole Odyssey."},
  {h:"The famous shades", body:"There he meets the dead he knew: his own mother, whose death he hadn't even heard of; [[agamemnon|Agamemnon]], still bitter over his murder; and [[achilles|Achilles]], who delivers the poem's bleakest line — that he would rather be a poor man's living slave than king over all the dead. The greatest hero of the Iliad, met in death, wants only to be alive again."}
 ],
 mind:"<p>The Underworld exists to make the Odyssey's central point unmissable: <strong>mortal life, however hard, is the only thing worth having</strong>. [[achilles|Achilles]]'s despairing wish to be a living nobody rather than a dead king is the exact mirror of [[odysseus|Odysseus]]'s choice to refuse [[calypso|Calypso]]'s immortality. Death clarifies everything: it is precisely because life ends that it matters at all.</p>",
 lore:"<p><span class=\"loretag\">World</span>The Homeric underworld is grimmer and grayer than the later, more elaborate versions with their reward-and-punishment geography; here nearly everyone simply fades. Odysseus's descent — the \"nekyia\" — founded one of literature's most enduring set-pieces: the hero's journey to the land of the dead. Virgil sent [[aeneas|Aeneas]] down after him, and Dante followed both, all the way to a Christian Hell. Every literary descent to the underworld since traces back, in the end, to this gray shore.</p>",
